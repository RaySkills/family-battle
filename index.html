<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>家族乱斗 - Family Battle</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0a0a1a;
  color: #fff;
  font-family: 'Microsoft YaHei', Arial, sans-serif;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ===== SCREENS ===== */
.screen {
  display: none;
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}
.screen.active { display: flex; }

/* ===== BACKGROUND ===== */
.bg-gradient {
  background: linear-gradient(135deg, #0a0a2e 0%, #1a0a2e 50%, #0a1a2e 100%);
}

/* ===== MAIN MENU ===== */
#screen-menu {
  background: linear-gradient(135deg, #0d0d2b 0%, #1a0033 100%);
}
#screen-menu h1 {
  font-size: clamp(2.5rem, 8vw, 5rem);
  text-shadow: 0 0 30px #ff6600, 0 0 60px #ff3300;
  color: #ffcc00;
  margin-bottom: 1rem;
  letter-spacing: 4px;
  animation: titlePulse 2s ease-in-out infinite;
}
#screen-menu .subtitle {
  color: #aaa;
  font-size: 1rem;
  margin-bottom: 3rem;
  letter-spacing: 6px;
}
@keyframes titlePulse {
  0%, 100% { text-shadow: 0 0 30px #ff6600, 0 0 60px #ff3300; }
  50% { text-shadow: 0 0 50px #ff9900, 0 0 100px #ff6600; }
}
.menu-buttons {
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 300px;
}
.btn-menu {
  padding: 16px 32px;
  font-size: 1.2rem;
  background: linear-gradient(135deg, #1a1a3a, #2a1a4a);
  border: 2px solid #4444aa;
  color: #fff;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 2px;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.btn-menu:hover, .btn-menu:active {
  background: linear-gradient(135deg, #3a1a5a, #4a2a6a);
  border-color: #8866ff;
  transform: scale(1.04);
  box-shadow: 0 0 20px rgba(136, 102, 255, 0.4);
}

/* ===== CHARACTER SELECT ===== */
#screen-char {
  background: linear-gradient(135deg, #0a1a0a 0%, #0a0a2e 100%);
  padding: 20px;
}
#screen-char h2 {
  font-size: 2rem;
  color: #ffcc00;
  margin-bottom: 8px;
  text-align: center;
}
#screen-char .select-hint {
  color: #aaa;
  font-size: 0.9rem;
  margin-bottom: 20px;
  text-align: center;
}
.char-grid {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 20px;
}
.char-card {
  width: 140px;
  background: linear-gradient(135deg, #111133, #221144);
  border: 2px solid #333366;
  border-radius: 12px;
  padding: 16px 12px;
  cursor: pointer;
  text-align: center;
  transition: all 0.2s;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.char-card:hover { border-color: #6666ff; transform: translateY(-4px); }
.char-card.selected-p1 { border-color: #4488ff; background: linear-gradient(135deg, #112244, #223366); box-shadow: 0 0 20px rgba(68, 136, 255, 0.5); }
.char-card.selected-p2 { border-color: #ff4444; background: linear-gradient(135deg, #441122, #663322); box-shadow: 0 0 20px rgba(255, 68, 68, 0.5); }
.char-emoji { font-size: 3rem; display: block; margin-bottom: 8px; }
.char-name { font-size: 1.1rem; font-weight: bold; color: #fff; margin-bottom: 6px; }
.char-hp { font-size: 0.8rem; color: #66ff66; }
.char-skills { font-size: 0.7rem; color: #aaa; margin-top: 4px; line-height: 1.4; }
.pvp-columns {
  display: flex;
  gap: 30px;
  justify-content: center;
}
.pvp-col { display: flex; flex-direction: column; align-items: center; }
.pvp-col-label { font-size: 1rem; color: #aaa; margin-bottom: 8px; }
.pvp-col-label.p1 { color: #4488ff; }
.pvp-col-label.p2 { color: #ff4444; }
.select-actions {
  display: flex;
  gap: 16px;
  margin-top: 10px;
}
.btn-action {
  padding: 12px 28px;
  font-size: 1rem;
  background: linear-gradient(135deg, #223300, #334400);
  border: 2px solid #556600;
  color: #ccff00;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 1px;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.btn-action:hover, .btn-action:active {
  background: linear-gradient(135deg, #334411, #445511);
  border-color: #88ff00;
  transform: scale(1.04);
}
.btn-back {
  background: linear-gradient(135deg, #332200, #442200);
  border-color: #664400;
  color: #ffaa00;
}
.btn-back:hover { border-color: #ffaa00; }

/* ===== DIFFICULTY ===== */
#screen-diff {
  background: linear-gradient(135deg, #1a0a0a 0%, #2a0a1a 100%);
}
#screen-diff h2 { font-size: 2rem; color: #ffcc00; margin-bottom: 2rem; }
.diff-buttons { display: flex; gap: 20px; }
.btn-diff {
  width: 140px;
  height: 140px;
  font-size: 1.1rem;
  background: linear-gradient(135deg, #221111, #331122);
  border: 2px solid #553333;
  color: #fff;
  border-radius: 16px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.btn-diff .diff-icon { font-size: 2.5rem; }
.btn-diff:hover, .btn-diff.selected {
  border-color: #ff6600;
  background: linear-gradient(135deg, #331111, #442222);
  box-shadow: 0 0 20px rgba(255, 102, 0, 0.4);
  transform: scale(1.06);
}

/* ===== BATTLE SCREEN ===== */
#screen-battle {
  background: #000;
  padding: 0;
  align-items: stretch;
  justify-content: flex-start;
  flex-direction: column;
}
#battle-container {
  position: relative;
  width: 800px;
  max-width: 100vw;
  margin: 0 auto;
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* ===== HUD ===== */
#battle-hud {
  position: relative;
  width: 800px;
  max-width: 100%;
  background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.6) 100%);
  padding: 8px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.hud-player {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.hud-player.p2 { align-items: flex-end; }
.hud-name {
  font-size: 0.85rem;
  font-weight: bold;
  display: flex;
  align-items: center;
  gap: 6px;
}
.hud-player.p2 .hud-name { flex-direction: row-reverse; }
.hp-bar-wrap {
  height: 14px;
  background: #111;
  border-radius: 7px;
  overflow: hidden;
  border: 1px solid #333;
  width: 100%;
}
.hp-bar {
  height: 100%;
  background: linear-gradient(90deg, #ff2222, #ff6600, #ffaa00);
  border-radius: 7px;
  transition: width 0.15s;
}
.mp-bar-wrap {
  height: 8px;
  background: #111;
  border-radius: 4px;
  overflow: hidden;
  border: 1px solid #222;
  width: 100%;
}
.mp-bar {
  height: 100%;
  background: linear-gradient(90deg, #2244ff, #4488ff);
  border-radius: 4px;
  transition: width 0.15s;
}
#timer-box {
  width: 70px;
  text-align: center;
  font-size: 1.6rem;
  font-weight: bold;
  color: #ffcc00;
  text-shadow: 0 0 10px #ff6600;
}

/* ===== CANVAS ===== */
#battle-canvas {
  width: 800px;
  max-width: 100%;
  height: auto;
  display: block;
  image-rendering: pixelated;
}

/* ===== SKILL BAR ===== */
#skill-bar {
  width: 800px;
  max-width: 100%;
  background: rgba(0,0,0,0.85);
  padding: 6px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.skill-group {
  display: flex;
  gap: 6px;
}
.skill-btn {
  width: 52px;
  height: 52px;
  background: linear-gradient(135deg, #1a1a3a, #2a2a4a);
  border: 2px solid #444488;
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 0.6rem;
  color: #ccc;
  gap: 2px;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  position: relative;
  overflow: hidden;
  transition: all 0.15s;
}
.skill-btn:hover, .skill-btn:active { border-color: #8888ff; }
.skill-btn.on-cd { opacity: 0.5; }
.skill-btn .cd-overlay {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.75rem;
  color: #fff;
  height: 0%;
  transition: height 0.1s;
}
.skill-key { font-size: 0.9rem; font-weight: bold; color: #88aaff; }
.skill-icon { font-size: 1.1rem; }
.skill-name-short { font-size: 0.55rem; color: #aaa; }

/* ===== MOBILE CONTROLS ===== */
#mobile-controls {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 160px;
  pointer-events: none;
  z-index: 100;
}
#joystick-area {
  position: absolute;
  left: 20px;
  bottom: 20px;
  width: 120px;
  height: 120px;
  pointer-events: all;
}
#joystick-base {
  width: 100%;
  height: 100%;
  background: rgba(255,255,255,0.1);
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  position: relative;
}
#joystick-stick {
  width: 50px; height: 50px;
  background: rgba(255,255,255,0.4);
  border-radius: 50%;
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  transition: none;
}
#mobile-btns {
  position: absolute;
  right: 20px;
  bottom: 20px;
  display: grid;
  grid-template-columns: 50px 50px;
  grid-template-rows: 50px 50px;
  gap: 8px;
  pointer-events: all;
}
.mob-btn {
  width: 50px; height: 50px;
  background: rgba(100, 100, 200, 0.4);
  border: 2px solid rgba(150, 150, 255, 0.6);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.9rem;
  color: #fff;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.mob-btn:active { background: rgba(150, 150, 255, 0.6); }

/* ===== RESULT SCREEN ===== */
#screen-result {
  background: linear-gradient(135deg, #0a0a1a 0%, #1a1a0a 100%);
}
#result-box {
  background: linear-gradient(135deg, #111133, #221144);
  border: 2px solid #4444aa;
  border-radius: 20px;
  padding: 40px;
  text-align: center;
  min-width: 380px;
  box-shadow: 0 0 60px rgba(100, 100, 255, 0.3);
}
#result-winner {
  font-size: 2.5rem;
  color: #ffcc00;
  margin-bottom: 8px;
  text-shadow: 0 0 20px #ff6600;
}
#result-detail { color: #aaa; margin-bottom: 20px; font-size: 0.9rem; }
#result-nickname-wrap { margin-bottom: 16px; }
#result-nickname-wrap label { display: block; color: #ccc; margin-bottom: 6px; font-size: 0.9rem; }
#result-nickname {
  padding: 8px 16px;
  background: #0a0a22;
  border: 1px solid #4444aa;
  border-radius: 8px;
  color: #fff;
  font-size: 1rem;
  width: 200px;
}
.result-buttons { display: flex; gap: 12px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }

/* ===== LEADERBOARD ===== */
#screen-lb {
  background: linear-gradient(135deg, #0a1a0a 0%, #0a0a2a 100%);
  padding: 30px;
}
#screen-lb h2 { font-size: 2rem; color: #ffcc00; margin-bottom: 20px; }
#lb-list {
  width: 500px;
  max-width: 95vw;
  background: rgba(0,0,0,0.5);
  border-radius: 12px;
  padding: 16px;
  max-height: 50vh;
  overflow-y: auto;
  margin-bottom: 20px;
}
.lb-row {
  display: flex;
  align-items: center;
  padding: 8px 12px;
  border-bottom: 1px solid #222;
  gap: 12px;
}
.lb-rank { width: 30px; color: #ffcc00; font-weight: bold; }
.lb-name { flex: 1; color: #fff; }
.lb-score { color: #66ff66; font-weight: bold; }
.lb-date { color: #666; font-size: 0.8rem; }

/* ===== OVERLAY / FLASH ===== */
#screen-flash {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: white;
  opacity: 0;
  pointer-events: none;
  z-index: 9999;
  transition: opacity 0.1s;
}

/* ===== CAMPAIGN ===== */
#screen-campaign {
  background: linear-gradient(135deg, #0a0a2e 0%, #1a0a0a 100%);
}
#screen-campaign h2 { font-size: 2rem; color: #ffcc00; margin-bottom: 20px; }
.campaign-stages {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 600px;
  margin-bottom: 20px;
}
.stage-btn {
  width: 100px;
  height: 80px;
  background: linear-gradient(135deg, #111133, #221144);
  border: 2px solid #333366;
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  transition: all 0.2s;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.stage-btn:hover { border-color: #8866ff; transform: scale(1.06); }
.stage-btn.locked { opacity: 0.4; cursor: not-allowed; }
.stage-btn.completed { border-color: #44ff44; }
.stage-num { font-size: 1.2rem; font-weight: bold; color: #ffcc00; }
.stage-name { font-size: 0.75rem; color: #aaa; }
.stage-icon { font-size: 1.5rem; }

/* ===== LOADING ===== */
#screen-loading {
  background: #000;
}
#screen-loading .load-text {
  font-size: 2rem;
  color: #fff;
  animation: blink 1s step-end infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #111; }
::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
</style>
</head>
<body>

<!-- FLASH OVERLAY -->
<div id="screen-flash"></div>

<!-- LOADING -->
<div id="screen-loading" class="screen active">
  <div style="font-size:4rem;margin-bottom:20px">⚔️</div>
  <div class="load-text">家族乱斗</div>
  <div style="color:#666;margin-top:12px;font-size:0.9rem">正在加载...</div>
</div>

<!-- MAIN MENU -->
<div id="screen-menu" class="screen">
  <h1>家族乱斗</h1>
  <div class="subtitle">FAMILY BATTLE</div>
  <div class="menu-buttons">
    <button class="btn-menu" onclick="selectMode('pvai')">单人模式 🤖</button>
    <button class="btn-menu" onclick="selectMode('pvp')">双人对战 👥</button>
    <button class="btn-menu" onclick="selectMode('campaign')">通关模式 🏆</button>
    <button class="btn-menu" onclick="showLeaderboard()">排行榜 📊</button>
  </div>
  <div style="color:#444;font-size:0.75rem;margin-top:30px">v3.0 Family Battle Engine</div>
</div>

<!-- CHARACTER SELECT -->
<div id="screen-char" class="screen bg-gradient">
  <h2 id="char-title">选择角色</h2>
  <div id="char-hint" class="select-hint">点击卡片选择角色</div>

  <!-- Single/Campaign layout -->
  <div id="char-single" class="char-grid"></div>

  <!-- PvP layout -->
  <div id="char-pvp" style="display:none">
    <div class="pvp-columns">
      <div class="pvp-col">
        <div class="pvp-col-label p1">👤 玩家1 (蓝)</div>
        <div id="char-grid-p1" class="char-grid" style="max-width:320px"></div>
      </div>
      <div class="pvp-col">
        <div class="pvp-col-label p2">👤 玩家2 (红)</div>
        <div id="char-grid-p2" class="char-grid" style="max-width:320px"></div>
      </div>
    </div>
  </div>

  <div class="select-actions">
    <button class="btn-action btn-back" onclick="showScreen('screen-menu')">← 返回</button>
    <button class="btn-action" id="btn-confirm-char" onclick="confirmSelect()">确认选择 ✓</button>
  </div>
</div>

<!-- DIFFICULTY -->
<div id="screen-diff" class="screen">
  <h2>选择难度</h2>
  <div class="diff-buttons">
    <button class="btn-diff" onclick="selectDiff('easy')">
      <span class="diff-icon">😊</span>
      <span>简单</span>
    </button>
    <button class="btn-diff selected" onclick="selectDiff('normal')">
      <span class="diff-icon">😤</span>
      <span>普通</span>
    </button>
    <button class="btn-diff" onclick="selectDiff('hard')">
      <span class="diff-icon">😈</span>
      <span>困难</span>
    </button>
  </div>
  <div style="margin-top:30px;display:flex;gap:16px">
    <button class="btn-action btn-back" onclick="showScreen('screen-char')">← 返回</button>
    <button class="btn-action" onclick="startBattle()">开始战斗 ⚔️</button>
  </div>
</div>

<!-- CAMPAIGN -->
<div id="screen-campaign" class="screen">
  <h2>通关模式 🏆</h2>
  <div class="campaign-stages" id="campaign-stages"></div>
  <button class="btn-action btn-back" onclick="showScreen('screen-menu')">← 返回</button>
</div>

<!-- BATTLE SCREEN -->
<div id="screen-battle" class="screen">
  <div id="battle-hud">
    <div class="hud-player p1">
      <div class="hud-name">
        <span id="p1-emoji">👩‍🍳</span>
        <span id="p1-name">何丽</span>
      </div>
      <div class="hp-bar-wrap"><div class="hp-bar" id="p1-hp-bar"></div></div>
      <div class="mp-bar-wrap"><div class="mp-bar" id="p1-mp-bar"></div></div>
    </div>
    <div id="timer-box">60</div>
    <div class="hud-player p2">
      <div class="hud-name">
        <span id="p2-name">王雷</span>
        <span id="p2-emoji">💪</span>
      </div>
      <div class="hp-bar-wrap"><div class="hp-bar" id="p2-hp-bar"></div></div>
      <div class="mp-bar-wrap"><div class="mp-bar" id="p2-mp-bar"></div></div>
    </div>
  </div>

  <div style="position:relative;flex:1;display:flex;align-items:stretch;">
    <canvas id="battle-canvas" width="800" height="450"></canvas>
  </div>

  <!-- Skill bar -->
  <div id="skill-bar">
    <div class="skill-group" id="p1-skills">
      <div class="skill-btn" id="p1-sk-j" onclick="playerSkill(1,'j')">
        <span class="skill-key">J</span>
        <span class="skill-icon">👊</span>
        <span class="skill-name-short">普攻</span>
        <div class="cd-overlay" id="p1-cd-j">0s</div>
      </div>
      <div class="skill-btn" id="p1-sk-k" onclick="playerSkill(1,'k')">
        <span class="skill-key">K</span>
        <span class="skill-icon">⚡</span>
        <span class="skill-name-short">技能1</span>
        <div class="cd-overlay" id="p1-cd-k">0s</div>
      </div>
      <div class="skill-btn" id="p1-sk-l" onclick="playerSkill(1,'l')">
        <span class="skill-key">L</span>
        <span class="skill-icon">🌀</span>
        <span class="skill-name-short">技能2</span>
        <div class="cd-overlay" id="p1-cd-l">0s</div>
      </div>
      <div class="skill-btn" id="p1-sk-u" onclick="playerSkill(1,'u')">
        <span class="skill-key">U</span>
        <span class="skill-icon">💥</span>
        <span class="skill-name-short">大招</span>
        <div class="cd-overlay" id="p1-cd-u">0s</div>
      </div>
    </div>
    <div style="color:#666;font-size:0.7rem;text-align:center;line-height:1.4">
      P1: A/D移动<br>W/空格跳跃<br>J/K/L/U技能
    </div>
    <div class="skill-group" id="p2-skills">
      <div class="skill-btn" id="p2-sk-1" onclick="playerSkill(2,'j')">
        <span class="skill-key">1</span>
        <span class="skill-icon">👊</span>
        <span class="skill-name-short">普攻</span>
        <div class="cd-overlay" id="p2-cd-j">0s</div>
      </div>
      <div class="skill-btn" id="p2-sk-2" onclick="playerSkill(2,'k')">
        <span class="skill-key">2</span>
        <span class="skill-icon">⚡</span>
        <span class="skill-name-short">技能1</span>
        <div class="cd-overlay" id="p2-cd-k">0s</div>
      </div>

// =============================================
// BATTLE INIT
// =============================================
function startBattle() {
  if (!selectedP1) { alert('请先选择角色！'); return; }

  canvas = document.getElementById('battle-canvas');
  ctx = canvas.getContext('2d');

  showScreen('screen-battle');
  initPlayers();
  updateHUD();
  updateSkillBar();
  setupMobileControls();

  projectiles = [];
  effects = [];
  damageNumbers = [];
  particles = [];
  battleTimer = 60;
  screenShake = { x: 0, y: 0, dur: 0 };

  document.getElementById('timer-box').textContent = '60';

  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (!gamePaused && gameRunning) {
      battleTimer--;
      document.getElementById('timer-box').textContent = battleTimer;
      if (battleTimer <= 0) endBattle('timeout');
    }
  }, 1000);

  gameRunning = true;
  gamePaused = false;
  lastTime = performance.now();
  if (animFrameId) cancelAnimationFrame(animFrameId);
  animFrameId = requestAnimationFrame(gameLoop);

  // AI
  if (gameMode === 'pvai' || gameMode === 'campaign') {
    scheduleAI();
  }
}

function initPlayers() {
  const ch1 = CHARS[selectedP1];
  const ch2 = CHARS[selectedP2];

  p1 = createFighter(ch1, 150, GROUND_Y, 1);
  p2 = createFighter(ch2, 620, GROUND_Y, -1);

  // HUD setup
  document.getElementById('p1-emoji').textContent = ch1.emoji;
  document.getElementById('p1-name').textContent = ch1.name;
  document.getElementById('p2-emoji').textContent = ch2.emoji;
  document.getElementById('p2-name').textContent = ch2.name;

  // Skill bar icons
  updateSkillBarIcons(1, ch1);
  updateSkillBarIcons(2, ch2);
}

function createFighter(charDef, x, y, facing) {
  return {
    id: charDef.id,
    name: charDef.name,
    emoji: charDef.emoji,
    x: x,
    y: y,
    vx: 0,
    vy: 0,
    facing: facing, // 1=right, -1=left
    hp: charDef.hp,
    maxHp: charDef.hp,
    mp: charDef.mp,
    maxMp: charDef.mp,
    skills: charDef.skills,
    cdTimers: { j: 0, k: 0, l: 0, u: 0 },
    onGround: true,
    stunned: false,
    stunTimer: 0,
    shielded: false,
    shieldTimer: 0,
    atkMult: 1.0,
    atkBuffTimer: 0,
    slowFactor: 1.0,
    slowTimer: 0,
    speedBoost: 0,
    speedTimer: 0,
    parryReady: false,
    hitFlash: 0,
    attacking: false,
    attackTimer: 0,
    width: CHAR_W,
    height: CHAR_H,
    jumping: false,
    alive: true
  };
}

function updateSkillBarIcons(player, charDef) {
  const skKeys = ['j', 'k', 'l', 'u'];
  const skIds = player === 1 ? ['p1-sk-j','p1-sk-k','p1-sk-l','p1-sk-u'] : ['p2-sk-1','p2-sk-2','p2-sk-3','p2-sk-4'];
  const skEmojis = ['👊','⚡','🌀','💥'];
  skKeys.forEach((k, i) => {
    const btn = document.getElementById(skIds[i]);
    if (!btn) return;
    const sk = charDef.skills[k];

    const nameEl = btn.querySelector('.skill-name-short');
    if (iconEl) iconEl.textContent = getSkillEmoji(sk);
    if (nameEl) nameEl.textContent = sk.name.slice(0, 4);
  });
}

function getSkillEmoji(sk) {
  if (!sk) return '❓';
  const typeEmojis = {
    melee:'👊', multi:'💫', knockback:'👊', dash:'🏃', shield:'🛡️',
    ultimate:'💥', teleport:'⚡', atkbuff:'⬆️', movebuff:'🔥',
    parry:'🛡️', heal:'💚', projectile:'🔮', slow:'❄️', stun:'⭐'
  };
  return typeEmojis[sk.type] || '✨';
}

// =============================================
// GAME LOOP
// =============================================
function gameLoop(timestamp) {
  if (!gameRunning) return;
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  if (!gamePaused) {
    update(dt);
    render();
  }

  animFrameId = requestAnimationFrame(gameLoop);
}

// =============================================
// UPDATE
// =============================================
function update(dt) {
  updateFighter(p1, dt, true);
  updateFighter(p2, dt, false);
  updateProjectiles(dt);
  updateEffects(dt);
  updateDamageNumbers(dt);
  updateParticles(dt);
  updateScreenShake(dt);
  updateHUD();
  updateCDOverlays();
}

function updateFighter(f, dt, isP1) {
  if (!f.alive) return;

  // Timers
  if (f.stunned) {
    f.stunTimer -= dt * 1000;
    if (f.stunTimer <= 0) f.stunned = false;
    // No movement when stunned
    f.vx = 0;
    applyGravity(f);
    moveFighter(f);
    return;
  }

  if (f.hitFlash > 0) f.hitFlash -= dt * 1000;
  if (f.attackTimer > 0) f.attackTimer -= dt * 1000;
  if (f.shieldTimer > 0) { f.shieldTimer -= dt * 1000; if (f.shieldTimer <= 0) f.shielded = false; }
  if (f.atkBuffTimer > 0) { f.atkBuffTimer -= dt * 1000; if (f.atkBuffTimer <= 0) f.atkMult = 1.0; }
  if (f.slowTimer > 0) { f.slowTimer -= dt * 1000; if (f.slowTimer <= 0) f.slowFactor = 1.0; }
  if (f.speedTimer > 0) { f.speedTimer -= dt * 1000; if (f.speedTimer <= 0) f.speedBoost = 0; }

  // CD
  for (const k in f.cdTimers) {
    if (f.cdTimers[k] > 0) f.cdTimers[k] -= dt;
  }

  // Input (only for human players)
  if (isP1) {
    handleP1Input(f);
  } else if (gameMode === 'pvp') {
    handleP2Input(f);
  }

  applyGravity(f);
  moveFighter(f);

  // Clamp to canvas
  f.x = Math.max(10, Math.min(CANVAS_W - CHAR_W - 10, f.x));

  // Update facing
  const opp = isP1 ? p2 : p1;
  if (opp) {
    f.facing = opp.x > f.x ? 1 : -1;
  }
}

function handleP1Input(f) {
  const spd = (MOVE_SPEED + f.speedBoost) * f.slowFactor;
  if (keys['KeyA'] || keys['ArrowLeft'] && false) { f.vx = -spd; }
  else if (keys['KeyD'] || keys['ArrowRight'] && false) { f.vx = spd; }
  else { f.vx *= 0.7; }

  if ((keys['KeyW'] || keys['Space']) && f.onGround) {
    f.vy = JUMP_FORCE;
    f.onGround = false;
  }
}

function handleP2Input(f) {
  const spd = (MOVE_SPEED + f.speedBoost) * f.slowFactor;
  if (keys['ArrowLeft']) { f.vx = -spd; }
  else if (keys['ArrowRight']) { f.vx = spd; }
  else { f.vx *= 0.7; }

  if (keys['ArrowUp'] && f.onGround) {
    f.vy = JUMP_FORCE;
    f.onGround = false;
  }
}

function applyGravity(f) {
  if (!f.onGround) {
    f.vy += GRAVITY;
  }
}

function moveFighter(f) {
  f.x += f.vx;
  f.y += f.vy;
  if (f.y >= GROUND_Y) {
    f.y = GROUND_Y;
    f.vy = 0;
    f.onGround = true;
  }
}

// =============================================
// PROJECTILE / EFFECTS
// =============================================
function updateProjectiles(dt) {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const proj = projectiles[i];
    proj.x += proj.vx;
    proj.lifetime -= dt * 1000;

    if (proj.lifetime <= 0 || proj.x < 0 || proj.x > CANVAS_W) {
      projectiles.splice(i, 1);
      continue;
    }

    const target = proj.owner === 1 ? p2 : p1;
    if (target && target.alive && !proj.hit) {
      if (Math.abs(proj.x - target.x) < 50 && Math.abs(proj.y - target.y) < 60) {
        proj.hit = true;
        applyDamage(target, proj.damage, proj.owner === 1 ? 1 : 2);
        spawnHitEffect(proj.x, proj.y, '#ffff00');
        projectiles.splice(i, 1);
      }
    }
  }
}

function updateEffects(dt) {
  for (let i = effects.length - 1; i >= 0; i--) {
    effects[i].life -= dt * 1000;
    if (effects[i].life <= 0) effects.splice(i, 1);
  }
}

function updateDamageNumbers(dt) {
  for (let i = damageNumbers.length - 1; i >= 0; i--) {
    const d = damageNumbers[i];
    d.y -= 50 * dt;
    d.life -= dt * 1000;
    d.alpha = Math.max(0, d.life / 1000);
    if (d.life <= 0) damageNumbers.splice(i, 1);
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.3;
    p.life -= dt * 1000;
    p.alpha = Math.max(0, p.life / p.maxLife);
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function updateScreenShake(dt) {
  if (screenShake.dur > 0) {
    screenShake.dur -= dt * 1000;
    screenShake.x = (Math.random() - 0.5) * 12;
    screenShake.y = (Math.random() - 0.5) * 12;
  } else {
    screenShake.x = 0;
    screenShake.y = 0;
  }
}

// =============================================
// SKILL EXECUTION
// =============================================
function playerSkill(player, skillKey) {
  if (!gameRunning || gamePaused) return;
  const f = player === 1 ? p1 : p2;
  if (!f || !f.alive || f.stunned) return;
  executeSkill(f, skillKey, player);
}

function executeSkill(fighter, skillKey, playerNum) {
  const sk = fighter.skills[skillKey];
  if (!sk) return;
  if (fighter.cdTimers[skillKey] > 0) return;
  if (sk.mp > 0 && fighter.mp < sk.mp) return;

  fighter.mp -= sk.mp;
  if (fighter.mp < 0) fighter.mp = 0;
  fighter.cdTimers[skillKey] = sk.cd;

  const opponent = playerNum === 1 ? p2 : p1;
  const dmg = Math.floor((sk.dmgMin || 0) + Math.random() * ((sk.dmgMax || sk.dmgMin || 0) - (sk.dmgMin || 0) + 1));
  const boostedDmg = Math.floor(dmg * fighter.atkMult);

  fighter.attacking = true;
  fighter.attackTimer = 300;

  switch (sk.type) {
    case 'melee':
    case 'knockback': {
      const dist = Math.abs(opponent.x - fighter.x);
      if (dist < (sk.range || 80)) {
        applyDamage(opponent, boostedDmg, playerNum);
        if (sk.type === 'knockback') {
          opponent.vx = fighter.facing * (sk.knockback || 20);
          opponent.vy = -5;
          opponent.onGround = false;
        }
        spawnHitEffect(opponent.x + CHAR_W / 2, opponent.y, '#ffff00');
      }
      break;
    }
    case 'multi': {
      const dist = Math.abs(opponent.x - fighter.x);
      if (dist < (sk.range || 85)) {
        let delay = 0;
        for (let h = 0; h < sk.hits; h++) {
          setTimeout(() => {
            if (!opponent.alive) return;
            const hDmg = Math.floor(((sk.dmgMin || 30) + Math.random() * 10) * fighter.atkMult);
            applyDamage(opponent, hDmg, playerNum);
            spawnHitEffect(opponent.x + CHAR_W / 2, opponent.y, '#ffff88');
          }, delay);
          delay += 150;
        }
      }
      break;
    }
    case 'stun': {
      const dist = Math.abs(opponent.x - fighter.x);
      if (dist < (sk.range || 90)) {
        applyDamage(opponent, boostedDmg, playerNum);
        opponent.stunned = true;
        opponent.stunTimer = sk.stunDur || 1500;
        spawnStarEffect(opponent.x + CHAR_W / 2, opponent.y - CHAR_H - 10);
      }
      break;
    }
    case 'projectile': {
      const proj = {
        x: fighter.x + (fighter.facing === 1 ? CHAR_W : 0),
        y: fighter.y - CHAR_H / 2,
        vx: fighter.facing * (sk.speed || 8),
        damage: boostedDmg,
        owner: playerNum,
        lifetime: 2000,
        hit: false,
        emoji: '🔮'
      };
      projectiles.push(proj);
      break;
    }
    case 'teleport': {
      // Teleport behind opponent
      const behindX = opponent.x - fighter.facing * (CHAR_W + 20);
      fighter.x = Math.max(10, Math.min(CANVAS_W - CHAR_W - 10, behindX));
      applyDamage(opponent, boostedDmg, playerNum);
      spawnHitEffect(opponent.x + CHAR_W / 2, opponent.y, '#aa44ff');
      spawnFlash('#aa44ff');
      break;
    }
    case 'dash': {
      fighter.x += fighter.facing * (sk.dashDist || 50);
      fighter.x = Math.max(10, Math.min(CANVAS_W - CHAR_W - 10, fighter.x));
      const distAfter = Math.abs(opponent.x - fighter.x);
      if (distAfter < (sk.range || 100)) {
        applyDamage(opponent, boostedDmg, playerNum);
        spawnHitEffect(opponent.x + CHAR_W / 2, opponent.y, '#ffaa00');
      }
      break;
    }
    case 'shield': {
      fighter.shielded = true;
      fighter.shieldTimer = sk.shieldDur || 3000;
      spawnEffect(fighter.x + CHAR_W / 2, fighter.y, '#4488ff', 60, 800);
      break;
    }
    case 'parry': {
      fighter.parryReady = true;
      setTimeout(() => { fighter.parryReady = false; }, 2000);
      spawnEffect(fighter.x + CHAR_W / 2, fighter.y, '#44ffff', 50, 600);
      break;
    }
    case 'atkbuff': {
      fighter.atkMult = 1.0 + (sk.buffAmt || 0.3);
      fighter.atkBuffTimer = sk.buffDur || 5000;
      spawnEffect(fighter.x + CHAR_W / 2, fighter.y, '#ffaa00', 50, 800);
      break;
    }
    case 'movebuff': {
      fighter.speedBoost = sk.speedBuff || 2;
      fighter.speedTimer = sk.buffDur || 4000;
      fighter.atkMult = 1.0 + (sk.atkBuff || 20) / 100;
      fighter.atkBuffTimer = sk.buffDur || 4000;
      spawnEffect(fighter.x + CHAR_W / 2, fighter.y, '#44ff44', 50, 800);
      break;
    }
    case 'heal': {
      const healed = Math.min(fighter.maxHp - fighter.hp, sk.healAmt || 80);
      fighter.hp += healed;
      spawnEffect(fighter.x + CHAR_W / 2, fighter.y, '#00ff88', 60, 800);
      spawnDamageNumber(fighter.x + CHAR_W / 2, fighter.y - CHAR_H, `+${healed}`, '#00ff88');
      break;
    }
    case 'slow': {
      const dist2 = Math.abs(opponent.x - fighter.x);
      // Throw slow ball
      const slowProj = {
        x: fighter.x + (fighter.facing === 1 ? CHAR_W : 0),
        y: fighter.y - CHAR_H / 2,
        vx: fighter.facing * 6,
        damage: boostedDmg,
        owner: playerNum,
        lifetime: 2000,
        hit: false,
        emoji: '❄️',
        isSlow: true,
        slowFactor: sk.slowFactor || 0.5,
        slowDur: sk.slowDur || 2000
      };
      projectiles.push(slowProj);
      break;
    }
    case 'ultimate': {
      executeUltimate(fighter, opponent, sk, boostedDmg, playerNum);
      break;
    }
  }

  // MP regen
  fighter.mp = Math.min(fighter.maxMp, fighter.mp + 5);
}

function executeUltimate(fighter, opponent, sk, dmg, playerNum) {
  // Screen flash
  triggerFlash('#ffffff', 200);
  screenShake.dur = 600;

  if (sk.shakeScreen) {
    // 全家之怒: area damage
    applyDamage(opponent, dmg, playerNum);
    spawnUltimateParticles(fighter.x + CHAR_W / 2, fighter.y);
    spawnHitEffect(opponent.x + CHAR_W / 2, opponent.y, '#ff4400', 80);
  } else if (sk.groundSlam) {
    // 雷霆一击
    fighter.vy = -10;
    setTimeout(() => {
      applyDamage(opponent, dmg, playerNum);
      screenShake.dur = 800;
      spawnUltimateParticles(fighter.x + CHAR_W / 2, GROUND_Y);
    }, 400);
  } else if (sk.launch) {
    // 同心合击
    applyDamage(opponent, dmg, playerNum);
    opponent.vy = -18;
    opponent.onGround = false;
    spawnUltimateParticles(opponent.x + CHAR_W / 2, opponent.y);
  } else if (sk.hits) {
    // 艳影绝杀: multi hits
    let delay = 0;
    for (let h = 0; h < sk.hits; h++) {
      setTimeout(() => {
        if (!opponent.alive) return;
        applyDamage(opponent, Math.floor((sk.dmgMin || 40) * fighter.atkMult), playerNum);
        spawnHitEffect(opponent.x + CHAR_W / 2, opponent.y, '#ff44ff');
      }, delay);
      delay += 120;
    }
  } else if (sk.aoeRange) {
    // 元气爆冲
    applyDamage(opponent, dmg, playerNum);
    spawnUltimateParticles(CANVAS_W / 2, CANVAS_H / 2);
    spawnFlash('#ffaaff');
  } else {
    applyDamage(opponent, dmg, playerNum);
    spawnUltimateParticles(opponent.x + CHAR_W / 2, opponent.y);
  }
}

function applyDamage(target, dmg, attackerPlayerNum) {
  if (!target || !target.alive) return;

  // Parry check
  if (target.parryReady) {
    target.parryReady = false;
    spawnEffect(target.x + CHAR_W / 2, target.y, '#ffffff', 70, 400);
    spawnDamageNumber(target.x + CHAR_W / 2, target.y - CHAR_H, 'PARRY!', '#00ffff');
    return;
  }

  let finalDmg = dmg;
  if (target.shielded) finalDmg = Math.floor(finalDmg * 0.5);

  target.hp -= finalDmg;
  target.hitFlash = 200;

  if (target.hp < 0) target.hp = 0;

  spawnDamageNumber(target.x + CHAR_W / 2, target.y - CHAR_H, `-${finalDmg}`, target.shielded ? '#88aaff' : '#ffff00');

  if (target.hp <= 0) {
    target.alive = false;
    endBattle(attackerPlayerNum === 1 ? 'p1' : 'p2');
  }
}

// =============================================
// SPAWN EFFECTS
// =============================================
function spawnHitEffect(x, y, color, size) {
  effects.push({ x, y, color: color || '#ffff00', size: size || 50, maxSize: size || 50, life: 300, maxLife: 300 });
}

function spawnStarEffect(x, y) {
  for (let i = 0; i < 5; i++) {
    const angle = (i / 5) * Math.PI * 2;
    effects.push({ x: x + Math.cos(angle) * 20, y: y, color: '#ffff00', size: 15, maxSize: 15, life: 600, maxLife: 600, isStar: true, angle: angle });
  }
}

function spawnEffect(x, y, color, size, life) {
  effects.push({ x, y, color, size: size || 50, maxSize: size || 50, life: life || 500, maxLife: life || 500 });
}

function spawnDamageNumber(x, y, text, color) {
  damageNumbers.push({ x, y, text, color: color || '#ffff00', life: 1000, maxLife: 1000, alpha: 1 });
}

function spawnUltimateParticles(x, y) {
  for (let i = 0; i < 30; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 8;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 3,
      color: ['#ff4400', '#ff8800', '#ffcc00', '#ffffff', '#ff44ff'][Math.floor(Math.random() * 5)],
      size: 3 + Math.random() * 6,
      life: 500 + Math.random() * 500,
      maxLife: 1000,
      alpha: 1
    });
  }
}

function spawnFlash(color) {
  const flash = document.getElementById('screen-flash');
  flash.style.background = color || '#ffffff';
  flash.style.opacity = '0.4';
  setTimeout(() => { flash.style.opacity = '0'; }, 150);
}

function triggerFlash(color, dur) {
  const flash = document.getElementById('screen-flash');
  flash.style.background = color || '#ffffff';
  flash.style.opacity = '0.6';
  setTimeout(() => { flash.style.opacity = '0'; }, dur || 200);
}

// =============================================
// RENDER
// =============================================
function render() {
  ctx.save();
  ctx.translate(screenShake.x, screenShake.y);

  // Background
  drawBackground();

  // Fighters
  if (p1) drawFighter(p1, 1);
  if (p2) drawFighter(p2, 2);

  // Projectiles
  projectiles.forEach(proj => {
    ctx.font = '24px serif';
    ctx.fillText(proj.emoji || '🔮', proj.x - 12, proj.y);
  });

  // Effects
  effects.forEach(ef => {
    const progress = 1 - ef.life / ef.maxLife;
    const alpha = ef.life / ef.maxLife;
    ctx.globalAlpha = alpha;
    if (ef.isStar) {
      ctx.font = '20px serif';
      ctx.fillText('⭐', ef.x - 10, ef.y);
    } else {
      ctx.strokeStyle = ef.color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(ef.x, ef.y, ef.size * (0.5 + progress * 0.5), 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  });

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Damage numbers
  damageNumbers.forEach(d => {
    ctx.globalAlpha = d.alpha;
    ctx.font = 'bold 22px Arial';
    ctx.fillStyle = d.color;
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeText(d.text, d.x - ctx.measureText(d.text).width / 2, d.y);
    ctx.fillText(d.text, d.x - ctx.measureText(d.text).width / 2, d.y);
    ctx.globalAlpha = 1;
  });

  ctx.restore();
}

function drawBackground() {
  // Sky
  const skyGrad = ctx.createLinearGradient(0, 0, 0, CANVAS_H);
  skyGrad.addColorStop(0, '#0a0a2e');
  skyGrad.addColorStop(1, '#1a0a3e');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  // Stars
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  for (let i = 0; i < 40; i++) {
    const sx = (i * 73 + 17) % CANVAS_W;
    const sy = (i * 53 + 7) % (GROUND_Y - 50);
    ctx.fillRect(sx, sy, 1.5, 1.5);
  }

  // Ground
  const groundGrad = ctx.createLinearGradient(0, GROUND_Y, 0, CANVAS_H);
  groundGrad.addColorStop(0, '#2a1a1a');
  groundGrad.addColorStop(1, '#1a0a0a');
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, GROUND_Y, CANVAS_W, CANVAS_H - GROUND_Y);

  // Ground line
  ctx.strokeStyle = '#664422';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  ctx.lineTo(CANVAS_W, GROUND_Y);
  ctx.stroke();

  // Platform decorations
  ctx.fillStyle = 'rgba(255,100,0,0.2)';
  ctx.fillRect(0, GROUND_Y, CANVAS_W, 4);
}

function drawFighter(f, pNum) {
  const cx = f.x + CHAR_W / 2;
  const cy = f.y;

  ctx.save();

  // Hit flash
  if (f.hitFlash > 0) {
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(f.hitFlash * 0.05);
  }

  // Shield glow
  if (f.shielded) {
    ctx.globalAlpha = 0.8;
    ctx.strokeStyle = '#4488ff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(cx, cy - CHAR_H / 2, CHAR_W * 0.8, CHAR_H * 0.6, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Body shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(cx, GROUND_Y + 4, 25, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  // Draw emoji character
  const fontSize = f.stunned ? 44 : 48;
  ctx.font = `${fontSize}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';

  // Stun effect
  if (f.stunned) {
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(Date.now() * 0.01);
  }

  // Flip if facing left
  if (f.facing === -1) {
    ctx.scale(-1, 1);
    ctx.fillText(f.emoji, -cx, cy - 4);
  } else {
    ctx.fillText(f.emoji, cx, cy - 4);
  }

  ctx.restore();

  // Stun stars above head
  if (f.stunned) {
    const t = Date.now() * 0.003;
    for (let i = 0; i < 3; i++) {
      const angle = t + (i / 3) * Math.PI * 2;
      const sx = cx + Math.cos(angle) * 22;
      const sy = cy - CHAR_H - 15 + Math.sin(angle * 2) * 5;
      ctx.font = '14px serif';
      ctx.textAlign = 'center';
      ctx.fillText('⭐', sx, sy);
    }
  }

  // Attack animation
  if (f.attacking && f.attackTimer > 0) {
    const atkX = cx + f.facing * 50;
    ctx.globalAlpha = f.attackTimer / 300;
    ctx.font = '28px serif';
    ctx.textAlign = 'center';
    ctx.fillText('💥', atkX, cy - CHAR_H / 2);
    ctx.globalAlpha = 1;
  }

  // Player indicator
  ctx.font = 'bold 11px Arial';
  ctx.textAlign = 'center';
  ctx.fillStyle = pNum === 1 ? '#4488ff' : '#ff4444';
  ctx.fillText(pNum === 1 ? 'P1' : 'P2', cx, cy - CHAR_H - 4);
}

// =============================================
// HUD UPDATE
// =============================================
function updateHUD() {
  if (!p1 || !p2) return;
  const p1HpPct = Math.max(0, (p1.hp / p1.maxHp) * 100);
  const p2HpPct = Math.max(0, (p2.hp / p2.maxHp) * 100);
  const p1MpPct = (p1.mp / p1.maxMp) * 100;
  const p2MpPct = (p2.mp / p2.maxMp) * 100;

  document.getElementById('p1-hp-bar').style.width = p1HpPct + '%';
  document.getElementById('p2-hp-bar').style.width = p2HpPct + '%';
  document.getElementById('p1-mp-bar').style.width = p1MpPct + '%';
  document.getElementById('p2-mp-bar').style.width = p2MpPct + '%';

  // HP color
  const p1Color = p1HpPct > 50 ? 'linear-gradient(90deg,#ff2222,#ff6600,#ffaa00)' : p1HpPct > 25 ? 'linear-gradient(90deg,#ff2222,#ff4400)' : '#ff0000';
  const p2Color = p2HpPct > 50 ? 'linear-gradient(90deg,#ff2222,#ff6600,#ffaa00)' : p2HpPct > 25 ? 'linear-gradient(90deg,#ff2222,#ff4400)' : '#ff0000';
  document.getElementById('p1-hp-bar').style.background = p1Color;
  document.getElementById('p2-hp-bar').style.background = p2Color;
}

function updateSkillBar() {
  if (!p1 || !p2) return;
  updateSkillBarIcons(1, CHARS[selectedP1]);
  updateSkillBarIcons(2, CHARS[selectedP2]);
}

function updateCDOverlays() {
  if (!p1 || !p2) return;
  const skKeys = ['j', 'k', 'l', 'u'];
  const p1CdIds = ['p1-cd-j', 'p1-cd-k', 'p1-cd-l', 'p1-cd-u'];
  const p2CdIds = ['p2-cd-j', 'p2-cd-k', 'p2-cd-l', 'p2-cd-u'];

  skKeys.forEach((k, i) => {
    const cd1 = p1.cdTimers[k] || 0;
    const el1 = document.getElementById(p1CdIds[i]);
    const sk1 = p1.skills[k];
    if (el1) {
      if (cd1 > 0) {
        el1.style.height = Math.min(100, (cd1 / (sk1.cd || 1)) * 100) + '%';
        el1.textContent = Math.ceil(cd1) + 's';
      } else {
        el1.style.height = '0%';
        el1.textContent = '';
      }
    }

    const cd2 = p2.cdTimers[k] || 0;
    const el2 = document.getElementById(p2CdIds[i]);
    const sk2 = p2.skills[k];
    if (el2) {
      if (cd2 > 0) {
        el2.style.height = Math.min(100, (cd2 / (sk2.cd || 1)) * 100) + '%';
        el2.textContent = Math.ceil(cd2) + 's';
      } else {
        el2.style.height = '0%';
        el2.textContent = '';
      }
    }
  });
}

// =============================================
// AI LOGIC
// =============================================
let aiTimer = null;

function scheduleAI() {
  if (aiTimer) clearTimeout(aiTimer);
  const intervals = { easy: 2000, normal: 1500, hard: 1000 };
  const interval = intervals[difficulty] || 1500;

  function aiTick() {
    if (!gameRunning || gamePaused) { aiTimer = setTimeout(aiTick, interval); return; }
    doAIAction();
    aiTimer = setTimeout(aiTick, interval);
  }
  aiTimer = setTimeout(aiTick, interval);
}

function doAIAction() {
  if (!p2 || !p2.alive || p2.stunned) return;
  const ai = p2;
  const player = p1;

  const dist = Math.abs(ai.x - player.x);
  const aiHP = ai.hp / ai.maxHp;

  // Movement
  if (difficulty === 'easy') {
    // Random movement
    const r = Math.random();
    if (r < 0.4) ai.vx = player.x > ai.x ? MOVE_SPEED : -MOVE_SPEED;
    else if (r < 0.6) ai.vx = (Math.random() - 0.5) * MOVE_SPEED * 2;
    else ai.vx = 0;
  } else {
    // Chase player
    if (dist > 100) {
      ai.vx = player.x > ai.x ? MOVE_SPEED * 0.9 : -MOVE_SPEED * 0.9;
    } else if (dist < 60 && difficulty === 'hard') {
      ai.vx = player.x > ai.x ? -MOVE_SPEED * 0.5 : MOVE_SPEED * 0.5;
    } else {
      ai.vx *= 0.5;
    }

    // Jump occasionally
    if (Math.random() < 0.15 && ai.onGround) {
      ai.vy = JUMP_FORCE;
      ai.onGround = false;
    }
  }

  // Skill selection
  if (difficulty === 'easy') {
    const r = Math.random();
    if (r < 0.5 && dist < 90) executeSkill(ai, 'j', 2);
    else if (r < 0.7 && dist < 100 && ai.cdTimers.k <= 0) executeSkill(ai, 'k', 2);
  } else if (difficulty === 'normal') {
    // Heal if low HP
    if (aiHP < 0.3 && ai.skills.l && ai.skills.l.type === 'heal' && ai.cdTimers.l <= 0) {
      executeSkill(ai, 'l', 2);
    } else if (dist < 90) {
      const skChoice = Math.random();
      if (skChoice < 0.5) executeSkill(ai, 'j', 2);
      else if (skChoice < 0.75 && ai.cdTimers.k <= 0) executeSkill(ai, 'k', 2);
      else if (ai.cdTimers.l <= 0) executeSkill(ai, 'l', 2);
    } else if (ai.skills.j.type === 'projectile') {
      executeSkill(ai, 'j', 2); // ranged attack
    }
  } else { // hard
    // Use parry proactively
    if (ai.skills.k && ai.skills.k.type === 'parry' && ai.cdTimers.k <= 0 && Math.random() < 0.3) {
      executeSkill(ai, 'k', 2);
    }
    // Use heal
    if (aiHP < 0.25 && ai.skills.l && ai.skills.l.type === 'heal' && ai.cdTimers.l <= 0) {
      executeSkill(ai, 'l', 2);
    }
    // Ultimate when can
    else if (ai.cdTimers.u <= 0 && ai.mp >= ai.skills.u.mp && Math.random() < 0.4) {
      executeSkill(ai, 'u', 2);
    } else if (dist < 90) {
      if (ai.cdTimers.k <= 0 && Math.random() < 0.6) executeSkill(ai, 'k', 2);
      else executeSkill(ai, 'j', 2);
    } else if (ai.skills.j.type === 'projectile') {
      executeSkill(ai, 'j', 2);
    }
  }
}

// =============================================
// END BATTLE
// =============================================
function endBattle(winner) {
  if (!gameRunning) return;
  gameRunning = false;

  if (aiTimer) clearTimeout(aiTimer);
  if (timerInterval) clearInterval(timerInterval);

  setTimeout(() => {
    let winnerName = '';
    let winnerEmoji = '';

    if (winner === 'p1') {
      winnerName = p1.name;
      winnerEmoji = p1.emoji;
    } else if (winner === 'p2') {
      winnerName = p2.name;
      winnerEmoji = p2.emoji;
    } else {
      // Timeout: compare HP
      if (p1.hp > p2.hp) { winnerName = p1.name; winnerEmoji = p1.emoji; winner = 'p1'; }
      else if (p2.hp > p1.hp) { winnerName = p2.name; winnerEmoji = p2.emoji; winner = 'p2'; }
      else { winnerName = '平局'; winnerEmoji = '🤝'; }
    }

    battleResult = { winner, winnerName, winnerEmoji, p1hp: p1.hp, p2hp: p2.hp, time: 60 - battleTimer };

    document.getElementById('result-winner').textContent = winner === 'timeout' ? '时间到！' : `${winnerName} 胜利！`;
    document.getElementById('result-emoji').textContent = winnerEmoji;
    document.getElementById('result-detail').textContent =
      `${p1.name} HP: ${p1.hp} | ${p2.name} HP: ${p2.hp} | 用时: ${battleResult.time}s`;

    // Campaign handling
    if (gameMode === 'campaign' && winner === 'p1') {
      campaignProgress = Math.max(campaignProgress, campaignStage + 1);
      campaignWins++;
    }

    showScreen('screen-result');
  }, 800);
}

function saveAndContinue() {
  const nick = document.getElementById('result-nickname').value.trim() || '无名英雄';
  if (!battleResult) return;
  const entry = {
    name: nick,
    winner: battleResult.winnerName,
    p1: CHARS[selectedP1].name,
    p2: CHARS[selectedP2].name,
    time: battleResult.time,
    date: new Date().toLocaleDateString('zh-CN')
  };
  uploadScore(entry);
}

function rematch() {
  startBattle();
}

async function uploadScore(entry) {
  try {
    const res = await fetch(JSONBIN_LATEST, { headers: { 'X-Master-Key': JSONBIN_KEY } });
    let data = { records: [] };
    if (res.ok) {
      const json = await res.json();
      data = json.record || { records: [] };
    }
    if (!data.records) data.records = [];
    data.records.unshift(entry);
    if (data.records.length > 100) data.records = data.records.slice(0, 100);

    await fetch(JSONBIN_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_KEY },
      body: JSON.stringify(data)
    });
    alert('战绩已保存！');
  } catch (e) {
    console.warn('保存失败', e);
    alert('保存失败，请检查网络');
  }
}

async function showLeaderboard() {
  showScreen('screen-lb');
  const lbList = document.getElementById('lb-list');
  lbList.innerHTML = '<div style="color:#666;text-align:center;padding:20px">加载中...</div>';
  try {
    const res = await fetch(JSONBIN_LATEST, { headers: { 'X-Master-Key': JSONBIN_KEY } });
    if (!res.ok) throw new Error('Failed');
    const json = await res.json();
    const records = (json.record && json.record.records) || [];
    if (records.length === 0) {
      lbList.innerHTML = '<div style="color:#666;text-align:center;padding:20px">暂无战绩</div>';
      return;
    }
    lbList.innerHTML = records.map((r, i) => `
      <div class="lb-row">
        <div class="lb-rank">${i + 1}</div>
        <div class="lb-name">${r.name || '?'}</div>
        <div class="lb-score">${r.winner || '?'} 胜</div>
        <div class="lb-date">${r.date || ''}</div>
      </div>
    `).join('');
  } catch (e) {
    lbList.innerHTML = '<div style="color:#f44;text-align:center;padding:20px">加载失败</div>';
  }
}

// =============================================
// KEYBOARD INPUT
// =============================================
document.addEventListener('keydown', e => {
  keys[e.code] = true;

  if (!gameRunning || gamePaused) return;

  // P1 skills
  if (e.code === 'KeyJ') { e.preventDefault(); executeSkill(p1, 'j', 1); }
  if (e.code === 'KeyK') { e.preventDefault(); executeSkill(p1, 'k', 1); }
  if (e.code === 'KeyL') { e.preventDefault(); executeSkill(p1, 'l', 1); }
  if (e.code === 'KeyU') { e.preventDefault(); executeSkill(p1, 'u', 1); }

  // P1 jump
  if ((e.code === 'KeyW' || e.code === 'Space') && p1 && p1.onGround) {
    e.preventDefault();
    p1.vy = JUMP_FORCE;
    p1.onGround = false;
  }

  // P2 skills (PvP)
  if (gameMode === 'pvp') {
    if (e.code === 'Digit1') { e.preventDefault(); executeSkill(p2, 'j', 2); }
    if (e.code === 'Digit2') { e.preventDefault(); executeSkill(p2, 'k', 2); }
    if (e.code === 'Digit3') { e.preventDefault(); executeSkill(p2, 'l', 2); }
    if (e.code === 'Digit4') { e.preventDefault(); executeSkill(p2, 'u', 2); }
    if (e.code === 'ArrowUp' && p2 && p2.onGround) {
      e.preventDefault();
      p2.vy = JUMP_FORCE;
      p2.onGround = false;
    }
  }

  if (e.code === 'Escape') {
    gamePaused = !gamePaused;
  }
});

document.addEventListener('keyup', e => {
  keys[e.code] = false;
});

// =============================================
// MOBILE CONTROLS
// =============================================
function setupMobileControls() {
  const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  const mobileCtrl = document.getElementById('mobile-controls');

  if (isMobile) {
    mobileCtrl.style.display = 'block';
    setupJoystick();
    setupMobileButtons();
  } else {
    mobileCtrl.style.display = 'none';
  }
}

function setupJoystick() {
  const area = document.getElementById('joystick-area');
  const stick = document.getElementById('joystick-stick');
  let active = false;
  let baseX = 0, baseY = 0;

  area.addEventListener('touchstart', e => {
    e.preventDefault();
    active = true;
    const rect = area.getBoundingClientRect();
    baseX = rect.left + rect.width / 2;
    baseY = rect.top + rect.height / 2;
  }, { passive: false });

  area.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!active || !p1) return;
    const touch = e.touches[0];
    const dx = touch.clientX - baseX;
    const dy = touch.clientY - baseY;
    const maxR = 50;
    const r = Math.min(Math.sqrt(dx * dx + dy * dy), maxR);
    const angle = Math.atan2(dy, dx);

    stick.style.left = (60 + Math.cos(angle) * Math.min(r, 40)) + 'px';
    stick.style.top = (60 + Math.sin(angle) * Math.min(r, 40)) + 'px';
    stick.style.transform = 'none';

    const spd = (MOVE_SPEED + p1.speedBoost) * p1.slowFactor;
    if (dx > 15) p1.vx = spd;
    else if (dx < -15) p1.vx = -spd;
    else p1.vx = 0;

    if (dy < -30 && p1.onGround) {
      p1.vy = JUMP_FORCE;
      p1.onGround = false;
    }
  }, { passive: false });

  const resetJoystick = (e) => {
    e.preventDefault();
    active = false;
    if (p1) p1.vx = 0;
    stick.style.left = '50%';
    stick.style.top = '50%';
    stick.style.transform = 'translate(-50%,-50%)';
  };
  area.addEventListener('touchend', resetJoystick, { passive: false });
  area.addEventListener('touchcancel', resetJoystick, { passive: false });
}

function setupMobileButtons() {
  const btns = document.querySelectorAll('.mob-btn');
  btns.forEach(btn => {
    const sk = btn.dataset.sk;
    btn.addEventListener('touchstart', e => {
      e.preventDefault();
      if (gameRunning && !gamePaused) executeSkill(p1, sk, 1);
    }, { passive: false });
  });
}

// =============================================
// INIT
// =============================================
window.addEventListener('load', () => {
  setTimeout(() => {
    showScreen('screen-menu');
  }, 800);
});

// Prevent context menu on long press (mobile)
document.addEventListener('contextmenu', e => e.preventDefault());

// Prevent scroll on arrow keys
window.addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
    e.preventDefault();
  }
});

// MP regeneration
setInterval(() => {
  if (!gameRunning || gamePaused) return;
  if (p1 && p1.alive) p1.mp = Math.min(p1.maxMp, p1.mp + 1);
  if (p2 && p2.alive) p2.mp = Math.min(p2.maxMp, p2.mp + 1);
}, 500);

// =============================================
// RESPONSIVE CANVAS SCALING
// =============================================
function resizeCanvas() {
  const canvas = document.getElementById('battle-canvas');
  if (!canvas) return;
  const maxW = Math.min(window.innerWidth, 800);
  canvas.style.width = maxW + 'px';
  canvas.style.height = (maxW * 450 / 800) + 'px';

  const hud = document.getElementById('battle-hud');
  if (hud) hud.style.maxWidth = maxW + 'px';
  const skillBar = document.getElementById('skill-bar');
  if (skillBar) skillBar.style.maxWidth = maxW + 'px';
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('load', resizeCanvas);
