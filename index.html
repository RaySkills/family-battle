<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>家族乱斗 Family Battle v3.0</title>
<style>
/* ===== RESET & BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #ff6b35;
  --secondary: #f7c59f;
  --dark: #0a0a1a;
  --darker: #050510;
  --gold: #ffd700;
  --blue: #4fc3f7;
  --red: #ef5350;
  --green: #66bb6a;
  --purple: #ab47bc;
  --hp-color: #4caf50;
  --mp-color: #2196f3;
}
html, body {
  width: 100%; height: 100%; overflow-x: hidden;
  background: var(--darker);
  color: #eee;
  font-family: 'Microsoft YaHei', '微软雅黑', Arial, sans-serif;
  user-select: none;
}
canvas#bgCanvas {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 0; pointer-events: none;
}
#app {
  position: relative; z-index: 1;
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
}

/* ===== SCREENS ===== */
.screen {
  display: none; width: 100%; max-width: 900px;
  padding: 16px; min-height: 100vh;
  flex-direction: column; align-items: center;
}
.screen.active { display: flex; }

/* ===== MAIN MENU ===== */
#mainMenu { justify-content: center; gap: 18px; }
.game-title {
  font-size: clamp(28px,6vw,52px); font-weight: 900;
  background: linear-gradient(135deg, #ffd700, #ff6b35, #ff4081);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; text-align: center;
  text-shadow: none; margin-bottom: 8px;
  animation: titlePulse 3s ease-in-out infinite;
}
@keyframes titlePulse {
  0%,100%{filter:drop-shadow(0 0 8px rgba(255,107,53,0.5))}
  50%{filter:drop-shadow(0 0 20px rgba(255,107,53,0.9))}
}
.game-subtitle {
  font-size: 14px; color: #aaa; text-align: center; margin-bottom: 20px;
}
.btn {
  padding: 14px 32px; font-size: 18px; font-weight: 700;
  border: none; border-radius: 12px; cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  min-width: 220px; text-align: center;
  font-family: inherit;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
.btn:active { transform: translateY(0); }
.btn-primary {
  background: linear-gradient(135deg, #ff6b35, #f7c59f);
  color: #111;
}
.btn-secondary {
  background: linear-gradient(135deg, #4fc3f7, #1565c0);
  color: #fff;
}
.btn-campaign {
  background: linear-gradient(135deg, #ffd700, #ff8f00);
  color: #111; position: relative;
}
.btn-campaign::after {
  content: '⭐ 推荐'; position: absolute; top: -10px; right: -10px;
  background: #ef5350; color: #fff; font-size: 11px; padding: 2px 8px;
  border-radius: 20px; font-weight: 700;
}
.btn-leaderboard {
  background: linear-gradient(135deg, #ab47bc, #7b1fa2);
  color: #fff;
}
.btn-sm {
  padding: 8px 18px; font-size: 14px; min-width: unset; border-radius: 8px;
}
.btn-danger {
  background: linear-gradient(135deg, #ef5350, #b71c1c);
  color: #fff;
}
.btn-success {
  background: linear-gradient(135deg, #66bb6a, #2e7d32);
  color: #fff;
}
.btn-disabled {
  background: #333 !important; color: #666 !important;
  cursor: not-allowed; transform: none !important;
}

/* ===== CHARACTER SELECT ===== */
.char-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 14px; width: 100%; margin: 16px 0;
}
.char-card {
  background: rgba(255,255,255,0.05);
  border: 2px solid rgba(255,255,255,0.1);
  border-radius: 14px; padding: 14px; text-align: center;
  cursor: pointer; transition: all 0.2s;
  position: relative; overflow: hidden;
}
.char-card:hover { border-color: var(--gold); background: rgba(255,215,0,0.1); }
.char-card.selected { border-color: var(--gold); background: rgba(255,215,0,0.2); box-shadow: 0 0 16px rgba(255,215,0,0.5); }
.char-card.disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
.char-avatar {
  width: 80px; height: 80px; border-radius: 50%; overflow: hidden;
  margin: 0 auto 10px; border: 3px solid rgba(255,255,255,0.2);
}
.char-avatar img { width: 100%; height: 100%; object-fit: cover; }
.char-avatar .emoji-fallback {
  width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
  font-size: 40px; background: rgba(255,255,255,0.05);
}
.char-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.char-stats { font-size: 11px; color: #aaa; line-height: 1.6; }

/* ===== DIFFICULTY SELECT ===== */
.diff-grid {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 12px; width: 100%; max-width: 500px; margin: 16px auto;
}
.diff-card {
  padding: 16px; border-radius: 12px; text-align: center; cursor: pointer;
  border: 2px solid transparent; transition: all 0.2s;
}
.diff-card:hover, .diff-card.selected { border-color: var(--gold); transform: scale(1.03); }
.diff-easy { background: linear-gradient(135deg, #1b5e20, #2e7d32); }
.diff-normal { background: linear-gradient(135deg, #1565c0, #1976d2); }
.diff-hard { background: linear-gradient(135deg, #bf360c, #d84315); }
.diff-hell { background: linear-gradient(135deg, #4a148c, #6a1b9a); }
.diff-name { font-size: 18px; font-weight: 700; }
.diff-desc { font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 4px; }

/* ===== BATTLE SCREEN ===== */
#battleScreen { padding: 8px; gap: 8px; }
.battle-top {
  width: 100%; display: flex; justify-content: space-between;
  align-items: flex-start; gap: 8px;
}
.fighter-panel {
  flex: 1; background: rgba(255,255,255,0.04);
  border-radius: 14px; padding: 12px; position: relative;
}
.fighter-panel.p2 { text-align: right; }
.fighter-label {
  font-size: 12px; color: #aaa; font-weight: 600; margin-bottom: 4px;
}
.fighter-name { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
.bar-wrap { margin-bottom: 6px; }
.bar-label { font-size: 11px; color: #aaa; margin-bottom: 2px; display: flex; justify-content: space-between; }
.bar-bg {
  width: 100%; height: 14px; background: rgba(0,0,0,0.4);
  border-radius: 7px; overflow: hidden;
}
.bar-fill {
  height: 100%; border-radius: 7px;
  transition: width 0.3s ease; position: relative;
}
.bar-fill::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50%;
  background: rgba(255,255,255,0.15); border-radius: 7px 7px 0 0;
}
.hp-bar { background: linear-gradient(90deg, #c62828, #4caf50); }
.mp-bar { background: linear-gradient(90deg, #1565c0, #42a5f5); }
.hp-bar.low { background: linear-gradient(90deg, #b71c1c, #ef5350); animation: lowHpPulse 0.8s ease-in-out infinite; }
@keyframes lowHpPulse { 0%,100%{opacity:1} 50%{opacity:0.7} }

.status-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; min-height: 20px; }
.status-badge {
  font-size: 10px; padding: 2px 6px; border-radius: 10px; font-weight: 700;
}
.badge-stun { background: #f9a825; color: #000; }
.badge-shield { background: #1e88e5; color: #fff; }
.badge-atk { background: #e65100; color: #fff; }
.badge-debuff { background: #7b1fa2; color: #fff; }
.badge-fatigue { background: #795548; color: #fff; }
.badge-invincible { background: #ffffff; color: #000; animation: flashWhite 0.2s infinite; }
@keyframes flashWhite { 0%,100%{opacity:1}50%{opacity:0.3} }
.combo-counter {
  font-size: 13px; font-weight: 700; color: var(--gold);
  margin-top: 4px; min-height: 18px;
}

.battle-mid {
  width: 100%; display: flex; align-items: center; justify-content: center;
  gap: 12px; position: relative; min-height: 180px;
}
.fighter-sprite {
  position: relative; display: flex; flex-direction: column; align-items: center;
  width: 140px;
}
.fighter-sprite .sprite-img {
  width: 120px; height: 120px; border-radius: 50%;
  border: 4px solid rgba(255,255,255,0.2);
  object-fit: cover; transition: all 0.2s;
  position: relative; z-index: 2;
}
.fighter-sprite .sprite-emoji {
  width: 120px; height: 120px; display: flex; align-items: center; justify-content: center;
  font-size: 64px; border-radius: 50%; background: rgba(255,255,255,0.05);
  border: 4px solid rgba(255,255,255,0.2); position: relative; z-index: 2;
}
.sprite-overlay {
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 120px; height: 120px; border-radius: 50%;
  z-index: 3; pointer-events: none;
}
.shield-aura {
  position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
  width: 136px; height: 136px; border-radius: 50%;
  border: 3px solid rgba(79,195,247,0.7);
  box-shadow: 0 0 15px rgba(79,195,247,0.5), inset 0 0 15px rgba(79,195,247,0.2);
  animation: shieldPulse 1.5s ease-in-out infinite;
  z-index: 1;
}
@keyframes shieldPulse { 0%,100%{opacity:1;transform:translateX(-50%) scale(1)} 50%{opacity:0.6;transform:translateX(-50%) scale(1.08)} }
.stun-indicator {
  position: absolute; top: -24px; left: 50%; transform: translateX(-50%);
  font-size: 20px; animation: spinStun 0.8s linear infinite; z-index: 4;
}
@keyframes spinStun { from{transform:translateX(-50%) rotate(0deg)} to{transform:translateX(-50%) rotate(360deg)} }
.vs-text {
  font-size: 28px; font-weight: 900; color: var(--gold);
  text-shadow: 0 0 20px rgba(255,215,0,0.7);
  animation: vsFloat 2s ease-in-out infinite;
}
@keyframes vsFloat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }

/* ===== BATTLE CONTROLS ===== */
.battle-controls {
  width: 100%; display: flex; justify-content: space-between;
  gap: 8px; margin-top: 8px;
}
.skills-panel {
  display: flex; flex-direction: column; gap: 6px; flex: 1;
}
.skill-btn {
  padding: 10px 14px; border: none; border-radius: 10px;
  font-size: 14px; font-weight: 700; cursor: pointer;
  position: relative; overflow: hidden; font-family: inherit;
  transition: all 0.15s; text-align: left;
  display: flex; align-items: center; gap: 8px;
}
.skill-btn:disabled, .skill-btn.on-cd {
  opacity: 0.5; cursor: not-allowed;
}
.skill-btn .key-hint {
  font-size: 11px; background: rgba(0,0,0,0.3);
  padding: 1px 5px; border-radius: 4px;
}
.skill-btn .cd-overlay {
  position: absolute; right: 0; top: 0; bottom: 0;
  background: rgba(0,0,0,0.5); transition: width 0.1s linear;
  border-radius: 0 10px 10px 0;
}
.skill-btn .use-count {
  position: absolute; top: 3px; right: 6px;
  font-size: 10px; color: rgba(255,255,255,0.5);
}
.btn-normal-atk { background: linear-gradient(135deg, #f57f17, #ff8f00); color: #000; }
.btn-skill1 { background: linear-gradient(135deg, #1565c0, #42a5f5); color: #fff; }
.btn-skill2 { background: linear-gradient(135deg, #e65100, #ff7043); color: #fff; }
.btn-ult { background: linear-gradient(135deg, #4a148c, #ce93d8); color: #fff; }

.battle-log-panel {
  width: 100%; background: rgba(0,0,0,0.4);
  border-radius: 10px; padding: 10px; max-height: 140px; overflow-y: auto;
}
.log-entry {
  font-size: 12px; padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
  display: flex; gap: 6px; align-items: flex-start;
}
.log-time { color: #666; flex-shrink: 0; }
.log-text { flex: 1; }
.log-damage { color: #ef9a9a; }
.log-heal { color: #a5d6a7; }
.log-skill { color: #90caf9; }
.log-system { color: #ffd54f; }
.log-block { color: var(--gold); font-weight: 700; }

/* ===== EFFECTS ===== */
.effect-container {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 100; overflow: hidden;
}
.effect-hit {
  position: absolute; font-size: 24px;
  animation: effectFade 0.6s ease-out forwards;
  z-index: 101; pointer-events: none;
}
@keyframes effectFade {
  0%{opacity:1;transform:scale(1) translateY(0)}
  100%{opacity:0;transform:scale(1.5) translateY(-40px)}
}
.effect-skill1 {
  position: absolute; border-radius: 50%;
  border: 3px solid #4fc3f7;
  animation: skillRing 0.6s ease-out forwards;
}
@keyframes skillRing {
  0%{opacity:1;transform:scale(0.5)} 100%{opacity:0;transform:scale(2)}
}
.effect-skill2 {
  position: absolute; border-radius: 4px;
  background: linear-gradient(135deg, #ff6b35, #ffd700);
  animation: skill2Flash 0.5s ease-out forwards;
}
@keyframes skill2Flash {
  0%,40%,80%{opacity:1} 20%,60%,100%{opacity:0}
}
.damage-number {
  position: absolute; font-weight: 900; pointer-events: none;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
  animation: dmgFloat 1s ease-out forwards; z-index: 102;
}
@keyframes dmgFloat {
  0%{opacity:1;transform:translateY(0) scale(1)}
  50%{opacity:1;transform:translateY(-30px) scale(1.3)}
  100%{opacity:0;transform:translateY(-60px) scale(0.8)}
}
.block-text {
  position: absolute; font-weight: 900; font-size: 22px; color: var(--gold);
  text-shadow: 0 0 10px rgba(255,215,0,0.8);
  animation: blockAnim 0.8s ease-out forwards; z-index: 103;
}
@keyframes blockAnim {
  0%{opacity:1;transform:scale(0.5)} 30%{transform:scale(1.3)} 100%{opacity:0;transform:scale(1) translateY(-30px)}
}
.fullscreen-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0); z-index: 99; pointer-events: none;
  transition: background 0.3s;
}
@keyframes screenShake {
  0%,100%{transform:translate(0,0)} 20%{transform:translate(-5px,3px)} 40%{transform:translate(5px,-3px)} 60%{transform:translate(-3px,5px)} 80%{transform:translate(3px,-5px)}
}
.shake { animation: screenShake 0.4s ease-in-out; }

/* ===== PARTICLE CANVAS ===== */
#particleCanvas {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 102;
}

/* ===== MODALS ===== */
.modal-backdrop {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.85); z-index: 200;
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.modal-backdrop.hidden { display: none; }
.modal-box {
  background: linear-gradient(135deg, #0f0f2e, #1a1a3e);
  border: 1px solid rgba(255,215,0,0.3);
  border-radius: 20px; padding: 28px; width: 100%; max-width: 540px;
  max-height: 90vh; overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.8);
}
.modal-title {
  font-size: 24px; font-weight: 900; text-align: center;
  margin-bottom: 20px; color: var(--gold);
}
.modal-actions { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }

/* ===== INPUT ===== */
.input-group { margin-bottom: 14px; }
.input-group label { display: block; font-size: 13px; color: #aaa; margin-bottom: 5px; }
.input-group input {
  width: 100%; padding: 10px 14px; background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
  color: #fff; font-size: 16px; font-family: inherit;
  outline: none; transition: border-color 0.2s;
}
.input-group input:focus { border-color: var(--gold); }

/* ===== RESULT SCREEN ===== */
#resultScreen { justify-content: center; }
.result-box {
  background: linear-gradient(135deg, #0f0f2e, #1a1a3e);
  border: 2px solid var(--gold); border-radius: 20px;
  padding: 28px; width: 100%; max-width: 480px; text-align: center;
}
.result-winner { font-size: 36px; font-weight: 900; color: var(--gold); margin: 10px 0; }
.result-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
.stat-item {
  background: rgba(255,255,255,0.05); border-radius: 10px; padding: 10px;
}
.stat-value { font-size: 22px; font-weight: 700; color: var(--primary); }
.stat-label { font-size: 11px; color: #aaa; margin-top: 2px; }

/* ===== LEADERBOARD ===== */
.lb-table { width: 100%; border-collapse: collapse; }
.lb-table th {
  background: rgba(255,215,0,0.15); padding: 8px 10px;
  text-align: left; font-size: 13px; color: var(--gold);
}
.lb-table td { padding: 8px 10px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.05); }
.lb-table tr:nth-child(1) td { color: var(--gold); }
.lb-table tr:nth-child(2) td { color: #c0c0c0; }
.lb-table tr:nth-child(3) td { color: #cd7f32; }
.recent-matches { margin-top: 16px; }
.match-item {
  display: flex; justify-content: space-between; padding: 8px;
  background: rgba(255,255,255,0.04); border-radius: 8px; margin-bottom: 6px;
  font-size: 12px;
}
.match-win { color: var(--green); }
.match-lose { color: var(--red); }

/* ===== CHAR WIN CHART ===== */
.char-wins-chart { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.char-win-bar-wrap { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.char-win-bar-bg { flex: 1; height: 18px; background: rgba(255,255,255,0.1); border-radius: 9px; overflow: hidden; }
.char-win-bar { height: 100%; border-radius: 9px; background: linear-gradient(90deg, var(--primary), var(--gold)); transition: width 0.8s; }
.char-win-name { width: 40px; }
.char-win-num { width: 30px; text-align: right; color: #aaa; font-size: 12px; }

/* ===== CAMPAIGN SCREEN ===== */
.campaign-progress {
  display: flex; justify-content: center; gap: 8px; margin: 12px 0; flex-wrap: wrap;
}
.stage-dot {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; border: 2px solid rgba(255,255,255,0.2);
}
.stage-dot.done { background: var(--green); border-color: var(--green); }
.stage-dot.current { background: var(--primary); border-color: var(--primary); animation: stagePulse 1s infinite; }
.stage-dot.pending { background: rgba(255,255,255,0.1); }
@keyframes stagePulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,107,53,0.7)} 50%{box-shadow:0 0 0 8px rgba(255,107,53,0)} }

/* ===== STORY MODAL ===== */
.story-text {
  font-size: 18px; line-height: 1.7; text-align: center;
  color: #fff; font-style: italic; padding: 10px;
}
.story-char { font-size: 48px; margin-bottom: 12px; text-align: center; }

/* ===== VICTORY ANIMATION ===== */
.victory-screen {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: radial-gradient(ellipse at center, rgba(255,215,0,0.3), rgba(0,0,0,0.9));
  z-index: 300; display: flex; flex-direction: column; align-items: center;
  justify-content: center; text-align: center;
}
.victory-screen.hidden { display: none; }
.victory-title {
  font-size: clamp(36px,8vw,72px); font-weight: 900;
  background: linear-gradient(135deg, #ffd700, #ff6b35);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; animation: victoryZoom 0.5s ease-out;
}
@keyframes victoryZoom { 0%{transform:scale(0)} 80%{transform:scale(1.1)} 100%{transform:scale(1)} }
.victory-subtitle { font-size: 20px; color: #fff; margin: 10px 0 20px; }

/* ===== TIMER ===== */
.battle-timer {
  font-size: 18px; font-weight: 700; color: var(--gold);
  background: rgba(0,0,0,0.4); padding: 4px 14px; border-radius: 20px;
  text-align: center; min-width: 60px;
}

/* ===== RESPONSIVE ===== */
@media(max-width: 600px) {
  .char-grid { grid-template-columns: repeat(2, 1fr); }
  .battle-controls { flex-direction: column; }
  .fighter-sprite .sprite-img, .fighter-sprite .sprite-emoji { width: 90px; height: 90px; }
  .skills-panel { flex-direction: row; flex-wrap: wrap; }
  .skill-btn { flex: 1; min-width: 80px; font-size: 12px; padding: 8px; }
  .diff-grid { grid-template-columns: 1fr; }
}

/* ===== MISC ===== */
.section-title {
  font-size: 18px; font-weight: 700; color: var(--gold);
  text-align: center; margin: 10px 0;
}
.loading-text { color: #aaa; font-size: 14px; text-align: center; padding: 20px; }
.tag-new {
  background: var(--red); color: #fff; font-size: 10px;
  padding: 1px 6px; border-radius: 8px; vertical-align: middle;
  margin-left: 6px; font-weight: 700;
}
.player-nick { font-size: 13px; color: var(--blue); margin-bottom: 4px; }

/* ===== MOBILE ENHANCED ===== */
@media(max-width: 768px) {
  /* 基础 */
  body { font-size: 14px; }
  * { touch-action: manipulation; }

  /* 主菜单 */
  .game-title { font-size: 32px; }
  .game-subtitle { font-size: 13px; }
  .menu-buttons { flex-direction: column; gap: 12px; align-items: center; }
  .btn-menu { width: 85vw; max-width: 320px; height: 54px; font-size: 16px; }

  logMsg('⚔️ 战斗开始！', 'system');
}

function startBattleLoops() {
  // MP recovery every 3s
  battle.mpRecovInterval = setInterval(() => {
    if (!battle.running) return;
    [0,1].forEach(i => {
      const f = battle.fighters[i];
      // MP recovery suppressed if too many normal attacks without skill
      if (Date.now() < f.mpRecovSuppressUntil) return;
      if (f.mp < f.mpMax) {
        f.mp = Math.min(f.mpMax, f.mp + 5);
        updateBars();
      }
    });
  }, 3000);

  // Timer
  battle.timerInterval = setInterval(() => {
    if (!battle.running) return;
    const elapsed = Math.floor((Date.now() - battle.startTime)/1000);
    const m = Math.floor(elapsed/60);
    const s = elapsed%60;
    document.getElementById('battleTimer').textContent = m+':'+(s<10?'0':'')+s;
  }, 500);

  // CD animation
  battle.cdAnimInterval = setInterval(() => {
    if (!battle.running) return;
    updateCDOverlays();
  }, 100);

  // AI loop
  if (battle.mode==='pvai'||battle.mode==='campaign') {
    scheduleAI();
  }
}

function scheduleAI() {
  if (!battle || !battle.running) return;
  const dc = DIFF_CONFIG[battle.diff] || DIFF_CONFIG.normal;
  battle.aiInterval = setTimeout(() => {
    if (!battle.running) return;
    aiTurn();
    scheduleAI();
  }, dc.interval);
}

function aiTurn() {
  const ai = battle.fighters[1];
  const player = battle.fighters[0];
  const dc = DIFF_CONFIG[battle.diff] || DIFF_CONFIG.normal;
  const now = Date.now();

  // Stunned? skip
  if (now < ai.stunUntil) return;

  // Hell: interrupt if player is casting (detect high combo) — just be aggressive
  // Low HP healing priority
  if (battle.diff==='hard'||battle.diff==='hell') {
    const hpPct = ai.hp/ai.hpMax;
    if (hpPct < 0.30 && ai.charName==='何熙' && now >= ai.cdEEnd && ai.mp >= ai.def.skill2.mpCost) {
      doAction(1,'E'); return;
    }
  }

  // AI counter if player spamming normals
  if (player.consecutiveNormalAtks >= 3 && now >= ai.cdWEnd && ai.mp >= ai.def.skill1.mpCost) {
    doAction(1,'W'); return;
  }

  // Decide action
  const r = Math.random();
  const pUlt = dc.pUlt;
  const pSkill = dc.pSkill + pUlt;
  if (r < pUlt && now >= ai.cdREnd && ai.mp >= ai.def.ult.mpCost) {
    doAction(1,'R');
  } else if (r < pSkill) {
    // try skill 2, then skill 1
    if (now >= ai.cdEEnd && ai.mp >= ai.def.skill2.mpCost) {
      doAction(1,'E');
    } else if (now >= ai.cdWEnd && ai.mp >= ai.def.skill1.mpCost) {
      doAction(1,'W');
    } else {
      doAction(1,'Q');
    }
  } else {
    doAction(1,'Q');
  }
}

// =============================================
// PLAYER ACTION
// =============================================
function playerAction(playerIdx, key) {
  if (!battle || !battle.running) return;
  const f = battle.fighters[playerIdx];
  if (Date.now() < f.stunUntil) { logMsg(`💫 ${f.charName}被眩晕！`, 'system'); return; }

  // PVP spam prevention: same key within 1s blocked
  if (battle.mode==='pvp' && key!=='Q') {
    const lkKey = `p${playerIdx}${key}`;
    const lkTime = battle.lastKeyTime[lkKey]||0;
    if (Date.now() - lkTime < 1000) { return; }
    battle.lastKeyTime[lkKey] = Date.now();
  }

  doAction(playerIdx, key);
}

function doAction(attackerIdx, key) {
  if (!battle || !battle.running) return;
  const attackerI = attackerIdx;
  const defenderI = 1 - attackerI;
  const attacker = battle.fighters[attackerI];
  const defender = battle.fighters[defenderI];
  const now = Date.now();

  if (now < attacker.stunUntil) return;

  if (key==='Q') {
    // Normal attack CD check
    if (now < attacker.cdQEnd) return;
    attacker.cdQEnd = now + 1200;

    // Fatigue: 3 consecutive normals -> fatigue
    attacker.normalsUsed++;
    attacker.normalsThisBurst++;
    attacker.consecutiveNormalAtks++;
    // If 5+ normals without skill, suppress MP recovery for 6s
    if (attacker.normalsThisBurst > 5) {
      attacker.mpRecovSuppressUntil = now + 6000;
    }

    let fatigued = false;
    if (attacker.normalsThisBurst >= 3 && !attacker.fatigueActive) {
      attacker.fatigueActive = true;
      attacker.fatigueTick = now + 2000;
    }
    if (attacker.fatigueActive && now < attacker.fatigueTick) {
      fatigued = true;
    } else if (attacker.fatigueActive && now >= attacker.fatigueTick) {
      attacker.fatigueActive = false;
      attacker.normalsThisBurst = 0;
    }

    let dmg = randInt(attacker.def.atk[0], attacker.def.atk[1]);
    if (attacker.def.atkMulti) dmg = Math.round(dmg * 1.5); // Zhuyan double hit
    if (fatigued) dmg = Math.round(dmg * 0.6);
    if (attacker.atkBuffUntil > now) dmg = Math.round(dmg * (1 + attacker.atkBuffAmt));
    if (attacker.spdbuffUntil > now) dmg = Math.round(dmg * 1.1);
    if (defender.debuffUntil > now) dmg = Math.round(dmg * 1); // attacker benefits from debuff on defender — actually debuff reduces defender's atk, so applied when defender attacks

    applyDamage(attackerI, defenderI, dmg, '普攻', fatigued ? 'fatigue' : 'normal');
    showHitEffect(defenderI, '💥', dmg, 'normal');
    updateBars();
    updateStatusBadges();

  } else if (key==='W') {
    if (now < attacker.cdWEnd) return;
    if (attacker.mp < attacker.def.skill1.mpCost) { logMsg(`💧 ${attacker.charName} MP不足！`,'system'); return; }
    attacker.mp -= attacker.def.skill1.mpCost;
    attacker.cdWEnd = now + attacker.def.skill1.cd * 1000;
    attacker.useCountW++;
    attacker.skillsUsed++;
    attacker.consecutiveNormalAtks = 0;
    attacker.normalsThisBurst = 0;
    attacker.fatigueActive = false;
    resetConsecutiveHits(defenderI);

    execSkill1(attackerI, defenderI);
    showSkill1Effect(attackerI);
    updateBars(); updateStatusBadges();

  } else if (key==='E') {
    if (now < attacker.cdEEnd) return;
    if (attacker.mp < attacker.def.skill2.mpCost) { logMsg(`💧 ${attacker.charName} MP不足！`,'system'); return; }
    attacker.mp -= attacker.def.skill2.mpCost;
    attacker.cdEEnd = now + attacker.def.skill2.cd * 1000;
    attacker.useCountE++;
    attacker.skillsUsed++;
    attacker.consecutiveNormalAtks = 0;
    attacker.normalsThisBurst = 0;
    attacker.fatigueActive = false;
    resetConsecutiveHits(defenderI);

    execSkill2(attackerI, defenderI);
    showSkill2Effect(attackerI);
    updateBars(); updateStatusBadges();

  } else if (key==='R') {
    if (now < attacker.cdREnd) return;
    if (attacker.mp < attacker.def.ult.mpCost) { logMsg(`💧 ${attacker.charName} MP不足！`,'system'); return; }
    attacker.mp -= attacker.def.ult.mpCost;
    attacker.cdREnd = now + attacker.def.ult.cd * 1000;
    attacker.useCountR++;
    attacker.skillsUsed++;
    attacker.consecutiveNormalAtks = 0;
    attacker.normalsThisBurst = 0;
    attacker.fatigueActive = false;
    resetConsecutiveHits(defenderI);

    execUlt(attackerI, defenderI);
  }
  updateBars();
}

function resetConsecutiveHits(defenderIdx) {
  battle.fighters[defenderIdx].consecutiveHits = 0;
}

// =============================================
// APPLY DAMAGE
// =============================================
function applyDamage(attackerIdx, defenderIdx, rawDmg, source, type='normal') {
  const attacker = battle.fighters[attackerIdx];
  const defender = battle.fighters[defenderIdx];
  const now = Date.now();

  // Invincibility check
  if (now < defender.invincibleUntil) {
    logMsg(`🌟 ${defender.charName} 无敌帧！`, 'system');
    return 0;
  }

  // Debuff on attacker reduces their damage
  let dmg = rawDmg;
  if (attacker.debuffUntil > now) dmg = Math.round(dmg * (1 - attacker.debuffAmt));

  // Shield reduction
  if (now < defender.shieldUntil) {
    dmg = Math.round(dmg * 0.6);
  }

  // Auto-block: defender hit 3 times in a row
  defender.consecutiveHits++;
  if (defender.consecutiveHits >= 3 && !defender.blockNextHit) {
    defender.blockNextHit = true;
  }

  // Block
  if (defender.blockNextHit) {
    dmg = Math.round(dmg * 0.4);
    defender.blockNextHit = false;
    defender.consecutiveHits = 0;
    defender.invincibleUntil = now + 500;
    showBlockEffect(defenderIdx);
    logMsg(`🛡️ ${defender.charName} 格挡！`, 'block');
  }

  if (dmg < 0) dmg = 0;
  defender.hp = Math.max(0, defender.hp - dmg);
  attacker.totalDmgDealt += dmg;
  defender.totalDmgTaken += dmg;

  if (source) logMsg(`⚔️ ${attacker.charName} 对 ${defender.charName} 造成 ${dmg} 点伤害 [${source}]${type==='fatigue'?' (疲劳)':''}`, 'damage');

  checkDeath(defenderIdx);
  return dmg;
}

function applyHeal(idx, amount) {
  const f = battle.fighters[idx];
  f.hp = Math.min(f.hpMax, f.hp + amount);
  logMsg(`💚 ${f.charName} 回复了 ${amount} 点HP`, 'heal');
}

function checkDeath(idx) {
  const f = battle.fighters[idx];
  if (f.hp <= 0 && battle.running) {
    f.hp = 0;
    battle.running = false;
    battle.winner = 1 - idx;
    endBattle();
  }
}

// =============================================
// SKILL IMPLEMENTATIONS
// =============================================
function execSkill1(ai, di) {
  const a = battle.fighters[ai]; const d = battle.fighters[di]; const now = Date.now();
  const type = a.def.skill1.type;
  logMsg(`✨ ${a.charName} 使用【${a.def.skill1.name}】`, 'skill');
  if (type==='stun') {
    const dmg = randInt(20,35);
    applyDamage(ai,di,dmg,a.def.skill1.name,'skill');
    d.stunUntil = now + 1500;
    logMsg(`💫 ${d.charName} 被眩晕1.5秒！`, 'system');
    document.getElementById(`stunIndicator${di+1}`).innerHTML = '<div class="stun-indicator">💫</div>';
    setTimeout(()=>{ if(document.getElementById(`stunIndicator${di+1}`)) document.getElementById(`stunIndicator${di+1}`).innerHTML=''; }, 1500);
  } else if (type==='heavy') {
    applyDamage(ai,di,70,a.def.skill1.name,'skill');
  } else if (type==='burst') {
    applyDamage(ai,di,90,a.def.skill1.name,'skill');
  } else if (type==='multi') {
    // 3-hit
    [0,1,2].forEach((i)=>{ setTimeout(()=>{ if(battle.running) { applyDamage(ai,di,35,`${a.def.skill1.name} 第${i+1}段`,'skill'); updateBars(); } }, i*200); });
  } else if (type==='block') {
    a.blockNextHit = true;
    logMsg(`🛡️ ${a.charName} 准备格挡下一次攻击！`, 'system');
  } else if (type==='debuff') {
    d.debuffUntil = now + 3000; d.debuffAmt = 0.25;
    logMsg(`☠️ ${d.charName} 攻击力降低25%，持续3秒`, 'system');
  }
}

function execSkill2(ai, di) {
  const a = battle.fighters[ai]; const d = battle.fighters[di]; const now = Date.now();
  const type = a.def.skill2.type;
  logMsg(`✨ ${a.charName} 使用【${a.def.skill2.name}】`, 'skill');
  if (type==='shield') {
    a.shieldUntil = now + 3000;
    logMsg(`🔵 ${a.charName} 进入防御状态！减伤40%持续3秒`, 'system');
    const el = document.getElementById(`shieldAura${ai+1}`);
    if (el) { el.innerHTML='<div class="shield-aura"></div>'; setTimeout(()=>{el.innerHTML='';},3000); }
  } else if (type==='atkbuff') {
    a.atkBuffUntil = now + 4000; a.atkBuffAmt = 0.25;
    logMsg(`🔥 ${a.charName} 攻击力提升25%，持续4秒`, 'system');
  } else if (type==='spdbuff') {
    a.spdbuffUntil = now + 4000; a.atkBuffUntil = now + 4000; a.atkBuffAmt = 0.1;
    logMsg(`⚡ ${a.charName} 攻速+移速提升，持续4秒`, 'system');
  } else if (type==='heal') {
    applyHeal(ai, 70);
  } else if (type==='multi') {
    // 何丽技能2 = 三段各35
    [0,1,2].forEach((i)=>{ setTimeout(()=>{ if(battle.running){ applyDamage(ai,di,35,`${a.def.skill2.name} 第${i+1}段`,'skill'); updateBars(); }},i*150); });
  }
  updateStatusBadges();
}

function execUlt(ai, di) {
  const a = battle.fighters[ai]; const d = battle.fighters[di]; const now = Date.now();
  const type = a.def.ult.type;
  logMsg(`💥💥💥 ${a.charName} 释放大招【${a.def.ult.name}】！！`, 'skill');
  showUltEffect(ai, di);
  setTimeout(()=>{
    if (!battle.running) return;
    if (type==='ultheal') {
      const dmg = 180; applyDamage(ai,di,dmg,a.def.ult.name,'ult');
      applyHeal(ai,80);
    } else if (type==='ultdmg') {
      let dmg = 0;
      if (a.charName==='王雷') dmg=210;
      else if (a.charName==='何蔚') dmg=200;
      else if (a.charName==='何熙') dmg=210;
      applyDamage(ai,di,dmg,a.def.ult.name,'ult');
    } else if (type==='multihit5') {
      // 朱艳 5段各40
      [0,1,2,3,4].forEach((i)=>{ setTimeout(()=>{ if(battle.running){ applyDamage(ai,di,40,`${a.def.ult.name} 第${i+1}段`,'ult'); updateBars(); }},i*120); });
    }
    updateBars(); updateStatusBadges();
  }, 700);
}

// =============================================
// BATTLE END
// =============================================
function endBattle() {
  if (battle.aiInterval) clearTimeout(battle.aiInterval);
  if (battle.mpRecovInterval) clearInterval(battle.mpRecovInterval);
  if (battle.timerInterval) clearInterval(battle.timerInterval);
  if (battle.cdAnimInterval) clearInterval(battle.cdAnimInterval);
  updateBars();

  if (battle.mode==='campaign') {
    handleCampaignEnd();
  } else {
    setTimeout(()=>showResultScreen(), 800);
  }
}

function handleCampaignEnd() {
  if (battle.winner===0) {
    // Player (何熙) won
    campaignStage++;
    if (campaignStage >= CAMPAIGN_STAGES.length) {
      // Campaign complete!
      showCampaignVictory();
    } else {
      // Restore 30% HP
      campaignPlayerHP = Math.min(CHARACTERS['何熙'].hp, Math.floor(battle.fighters[0].hp + CHARACTERS['何熙'].hp * 0.3));
      setTimeout(()=>showStoryModal(campaignStage), 800);
    }
  } else {
    // Player lost in campaign
    setTimeout(()=>{
      alert(`😢 在第${campaignStage+1}关被${CAMPAIGN_STAGES[campaignStage].boss}击败！重新开始通关。`);
      goToMain();
    }, 500);
  }
}

function showCampaignVictory() {
  document.getElementById('victorySubtitle').textContent = `${playerNicks[0]} 完成了家族乱斗通关模式！`;
  document.getElementById('victoryScreen').classList.remove('hidden');
  launchVictoryParticles();
  updateGistCampaign();
}

function launchVictoryParticles() {
  const canvas = document.getElementById('particleCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const particles = [];
  const colors = ['#ffd700','#ff6b35','#ff4081','#4fc3f7','#66bb6a','#ab47bc'];
  for (let i=0;i<80;i++) {
    particles.push({
      x: Math.random()*canvas.width, y: Math.random()*canvas.height,
      vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6-3,
      color:colors[Math.floor(Math.random()*colors.length)],
      size:Math.random()*8+3, life:1, decay:Math.random()*0.015+0.01
    });
  }
  function animate() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.1; p.life-=p.decay;
      if(p.life>0){
        ctx.globalAlpha=p.life; ctx.fillStyle=p.color;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
      }
    });
    if (particles.some(p=>p.life>0)) requestAnimationFrame(animate);
    else { ctx.clearRect(0,0,canvas.width,canvas.height); ctx.globalAlpha=1; }
  }
  animate();
}

function finishCampaign() {
  document.getElementById('victoryScreen').classList.add('hidden');
  saveResultAndReturn();
  goToMain();
}

function surrenderBattle() {
  if (!battle || !battle.running) return;
  if (!confirm('确定要投降吗？')) return;
  battle.running = false;
  battle.winner = 1;
  endBattle();
}

function getSpriteBounds(idx) {
  const el = document.getElementById(`sprite${idx+1}`);
  if (!el) return {x:window.innerWidth/2, y:window.innerHeight/2, w:120, h:120};
  const r = el.getBoundingClientRect();
  return {x:r.left+r.width/2, y:r.top+r.height/2, w:r.width, h:r.height};
}

function showHitEffect(targetIdx, emoji, dmg, type) {
  const b = getSpriteBounds(targetIdx);
  const ec = document.getElementById('effectContainer');
  // Emoji hit
  const div = document.createElement('div');
  div.className = 'effect-hit';
  div.textContent = emoji;
  div.style.left = (b.x+randInt(-20,20))+'px';
  div.style.top = (b.y-20)+'px';
  ec.appendChild(div);
  setTimeout(()=>div.remove(), 700);
  // Damage number
  const dmgEl = document.createElement('div');
  dmgEl.className = 'damage-number';
  const fontSize = type==='ult'?28:type==='skill'?22:16;
  const color = type==='ult'?'#ff4081':type==='skill'?'#ffd700':'#ef9a9a';
  dmgEl.style.cssText = `left:${b.x+randInt(-30,30)}px;top:${b.y-40}px;font-size:${fontSize}px;color:${color};`;
  dmgEl.textContent = '-'+dmg;
  ec.appendChild(dmgEl);
  setTimeout(()=>dmgEl.remove(), 1100);
}

function showBlockEffect(targetIdx) {
  const b = getSpriteBounds(targetIdx);
  const ec = document.getElementById('effectContainer');
  const el = document.createElement('div');
  el.className = 'block-text';
  el.textContent = '格挡！';
  el.style.left = (b.x-30)+'px';
  el.style.top = (b.y-60)+'px';

}

function showSkill1Effect(idx) {

}

function showSkill2Effect(idx) {

function showUltEffect(attackerIdx, defenderIdx) {
  // Full screen dim
  const ov = document.getElementById('screenOverlay');
  ov.style.background = 'rgba(0,0,0,0.7)';
  setTimeout(()=>{ ov.style.background='rgba(0,0,0,0)'; },400);

  // Sprite zoom
  const sprite = document.getElementById(`sprite${attackerIdx+1}`);
  if (sprite) {
    sprite.style.transition='transform 0.3s';

  }

  // Target shake
  const tSprite = document.getElementById(`sprite${defenderIdx+1}`);
  if (tSprite) {
    tSprite.classList.add('shake');
    setTimeout(()=>tSprite.classList.remove('shake'),500);
  }

  // Particles
  const canvas = document.getElementById('particleCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const b = getSpriteBounds(defenderIdx);
  const particles = [];
  const colors = ['#ffd700','#ff4081','#ff6b35','#fff'];
  for (let i=0;i<60;i++) {
    const angle = Math.random()*Math.PI*2;
    const speed = Math.random()*8+2;
    particles.push({
      x:b.x, y:b.y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed,
      color:colors[i%colors.length], size:Math.random()*6+2, life:1, decay:0.025
    });
  }
  function animP() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life-=p.decay;
      if(p.life>0){
        ctx.globalAlpha=p.life; ctx.fillStyle=p.color;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
      }
    });
    if(particles.some(p=>p.life>0)) requestAnimationFrame(animP);
    else { ctx.clearRect(0,0,canvas.width,canvas.height); ctx.globalAlpha=1; }
  }
  animP();
}

// =============================================
// UI UPDATES
// =============================================
function updateBars() {
  if (!battle) return;
  [0,1].forEach(i=>{
    const f = battle.fighters[i];
    const hpPct = f.hpMax>0?(f.hp/f.hpMax)*100:0;
    const mpPct = f.mpMax>0?(f.mp/f.mpMax)*100:0;
    const hpBar = document.getElementById(`p${i+1}HpBar`);
    const mpBar = document.getElementById(`p${i+1}MpBar`);
    const hpTxt = document.getElementById(`p${i+1}HpText`);
    const mpTxt = document.getElementById(`p${i+1}MpText`);
    if (hpBar) { hpBar.style.width=hpPct+'%'; hpBar.classList.toggle('low', hpPct<30); }
    if (mpBar) mpBar.style.width=mpPct+'%';
    if (hpTxt) hpTxt.textContent=`${Math.ceil(f.hp)}/${f.hpMax}`;
    if (mpTxt) mpTxt.textContent=`${Math.ceil(f.mp)}/${f.mpMax}`;
  });
}

function updateStatusBadges() {
  if (!battle) return;
  const now = Date.now();
  [0,1].forEach(i=>{
    const f = battle.fighters[i];
    const el = document.getElementById(`p${i+1}Badges`);
    if (!el) return;
    let html = '';
    if (now < f.stunUntil) html += '<span class="status-badge badge-stun">💫眩晕</span>';
    if (now < f.shieldUntil) html += '<span class="status-badge badge-shield">🔵护盾</span>';
    if (now < f.atkBuffUntil) html += '<span class="status-badge badge-atk">🔥攻击+</span>';
    if (now < f.debuffUntil) html += '<span class="status-badge badge-debuff">☠️攻击-</span>';
    if (f.fatigueActive && now < f.fatigueTick) html += '<span class="status-badge badge-fatigue">😮‍💨疲劳</span>';
    if (now < f.invincibleUntil) html += '<span class="status-badge badge-invincible">⚡无敌</span>';
    el.innerHTML = html;

    // Combo
    const comboEl = document.getElementById(`p${i+1}Combo`);
    if (comboEl) comboEl.textContent = f.consecutiveNormalAtks>1?`连击×${f.consecutiveNormalAtks}`:'';

    // Fatigue visual on sprite
    const imgEl = document.getElementById(`p${i+1}Img`);
    const emojiEl = document.getElementById(`p${i+1}Emoji`);
    const fatigued = f.fatigueActive && now < f.fatigueTick;
    if (imgEl) imgEl.style.opacity = fatigued?'0.5':'1';
    if (emojiEl) emojiEl.style.opacity = fatigued?'0.5':'1';
  });
}

function updateCDOverlays() {
  if (!battle) return;
  const now = Date.now();
  [0,1].forEach(i=>{
    const f = battle.fighters[i];
    const prefix = i===0?'p1':'p2';
    // Q
    const qPct = f.cdQEnd>now ? Math.max(0,((f.cdQEnd-now)/1200)*100) : 0;
    const qEl = document.getElementById(`${prefix}QCd`);
    if (qEl) qEl.style.width=qPct+'%';
    const qBtn = document.getElementById(`${prefix}Q`);
    if (qBtn) qBtn.disabled = (now < f.cdQEnd);

    // W
    const wDur = f.def.skill1.cd*1000;
    const wPct = f.cdWEnd>now?Math.max(0,((f.cdWEnd-now)/wDur)*100):0;
    const wEl = document.getElementById(`${prefix}WCd`); if(wEl)wEl.style.width=wPct+'%';
    const wBtn = document.getElementById(`${prefix}W`); if(wBtn)wBtn.disabled=(now<f.cdWEnd||f.mp<f.def.skill1.mpCost);
    if(document.getElementById(`${prefix}WCount`))document.getElementById(`${prefix}WCount`).textContent=f.useCountW?`×${f.useCountW}`:'';

    // E
    const eDur = f.def.skill2.cd*1000;
    const ePct = f.cdEEnd>now?Math.max(0,((f.cdEEnd-now)/eDur)*100):0;
    const eEl = document.getElementById(`${prefix}ECd`); if(eEl)eEl.style.width=ePct+'%';
    const eBtn = document.getElementById(`${prefix}E`); if(eBtn)eBtn.disabled=(now<f.cdEEnd||f.mp<f.def.skill2.mpCost);
    if(document.getElementById(`${prefix}ECount`))document.getElementById(`${prefix}ECount`).textContent=f.useCountE?`×${f.useCountE}`:'';

    // R
    const rDur = f.def.ult.cd*1000;
    const rPct = f.cdREnd>now?Math.max(0,((f.cdREnd-now)/rDur)*100):0;
    const rEl = document.getElementById(`${prefix}RCd`); if(rEl)rEl.style.width=rPct+'%';
    const rBtn = document.getElementById(`${prefix}R`); if(rBtn)rBtn.disabled=(now<f.cdREnd||f.mp<f.def.ult.mpCost);
    if(document.getElementById(`${prefix}RCount`))document.getElementById(`${prefix}RCount`).textContent=f.useCountR?`×${f.useCountR}`:'';
  });
}

function logMsg(text, type='normal') {
  if (!battle) return;
  const now = new Date();
  const ts = `${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
  const entry = {ts, text, type};
  battle.logEntries.unshift(entry);
  if (battle.logEntries.length>20) battle.logEntries.pop();
  const log = document.getElementById('battleLog');
  if (!log) return;
  const cls = type==='damage'?'log-damage':type==='heal'?'log-heal':type==='skill'?'log-skill':type==='block'?'log-block':'log-system';
  const div = document.createElement('div');
  div.className='log-entry';
  div.innerHTML=`<span class="log-time">${ts}</span><span class="log-text ${cls}">${text}</span>`;
  log.prepend(div);
  while(log.children.length>10) log.removeChild(log.lastChild);
}

async function saveResultAndReturn() {
  if (!battle) { goToMain(); return; }
  const winnerIdx = battle.winner;
  const loserIdx = 1-battle.winner;
  const winner = battle.fighters[winnerIdx];
  const loser = battle.fighters[loserIdx];
  const winNick = battle.nicks[winnerIdx];
  const loseNick = battle.nicks[loserIdx];

  if (!gistData) await loadGistData();
  if (!gistData) { goToMain(); return; }

  // Update stats
  const today = new Date().toISOString().split('T')[0];
  gistData.stats.totalGames++;
  if (!gistData.stats.characterWins[winner.charName]) gistData.stats.characterWins[winner.charName]=0;
  gistData.stats.characterWins[winner.charName]++;

  // Update leaderboard
  let lbEntry = gistData.leaderboard.find(e=>e.name===winNick);
  if (!lbEntry) { lbEntry={name:winNick,wins:0,character:winner.charName,campaignClears:0}; gistData.leaderboard.push(lbEntry); }
  lbEntry.wins++;
  lbEntry.character = winner.charName;

  // Recent match
  gistData.recentMatches.unshift({winner:winNick,loser:loseNick,winChar:winner.charName,loseChar:loser.charName,mode:battle.mode,date:today});
  if (gistData.recentMatches.length>20) gistData.recentMatches.length=20;

  if (battle.mode==='campaign') {
    gistData.stats.campaignClears = (gistData.stats.campaignClears||0)+1;
    let cEntry = gistData.leaderboard.find(e=>e.name===winNick);
    if (cEntry) cEntry.campaignClears=(cEntry.campaignClears||0)+1;
  }

  await patchGist();
  goToMain();
}

// =============================================
async function loadGistData() {
  try {
    const res = await fetch(JSONBIN_LATEST, {
      headers: {'X-Master-Key': JSONBIN_KEY, 'X-Bin-Meta': 'false'}
    });
    if (!res.ok) throw new Error('fetch failed');
    const json = await res.json();
    if (json.record) gistData = validateGistData(json.record);
    else gistData = defaultGistData();
  } catch(e) {
    console.error('loadGistData error:', e);
    gistData = defaultGistData();
  }
  return gistData;
}

function defaultGistData() {
  return {
    leaderboard:[],
    recentMatches:[],
    stats:{totalGames:0,characterWins:{'何丽':0,'王雷':0,'朱艳':0,'何蔚':0,'何熙':0},campaignClears:0}
  };
}

async function patchGist() {
  try {
    const res = await fetch(JSONBIN_URL, {
      method: 'PUT',
      headers: {'Content-Type':'application/json','X-Master-Key':JSONBIN_KEY},
      body: JSON.stringify(gistData)
    });
    if (!res.ok) console.error('jsonbin PUT failed', res.status);
  } catch(e) { console.error(e); }
}

async function loadLeaderboard() {
  await loadGistData();
  if (!gistData) { document.getElementById('lbContent').innerHTML='<div class="loading-text">❌ 加载失败</div>'; return; }
  const lb = [...(gistData.leaderboard||[])].sort((a,b)=>b.wins-a.wins).slice(0,10);
  const rm = (gistData.recentMatches||[]).slice(0,10);
  const stats = gistData.stats||{};
  const cw = stats.characterWins||{};
  const maxWins = Math.max(1,...Object.values(cw));

  let html = `<div style="font-size:13px;color:#aaa;margin-bottom:8px">总对战：${stats.totalGames||0} 场 | 通关：${stats.campaignClears||0} 次</div>`;

  // Leaderboard table
  html += `<table class="lb-table"><thead><tr><th>#</th><th>昵称</th><th>角色</th><th>胜场</th><th>通关</th></tr></thead><tbody>`;
  lb.forEach((e,i)=>{
    html+=`<tr><td>${['🥇','🥈','🥉'][i]||i+1}</td><td>${esc(e.name)}</td><td>${esc(e.character||'-')}</td><td>${e.wins}</td><td>${e.campaignClears||0}</td></tr>`;
  });
  html+=`</tbody></table>`;

  // Char wins chart
  html+=`<div style="margin-top:16px;font-weight:700;color:var(--gold)">角色胜场统计</div><div class="char-wins-chart">`;
  Object.entries(cw).forEach(([name,wins])=>{
    const pct=Math.round((wins/maxWins)*100);
    html+=`<div class="char-win-bar-wrap"><span class="char-win-name">${esc(name)}</span><div class="char-win-bar-bg"><div class="char-win-bar" style="width:${pct}%"></div></div><span class="char-win-num">${wins}</span></div>`;
  });
  html+=`</div>`;

  // Recent matches
  html+=`<div class="recent-matches"><div style="font-weight:700;color:var(--gold);margin-bottom:8px">最近对战记录</div>`;
  rm.forEach(m=>{
    html+=`<div class="match-item"><span class="match-win">🏆 ${esc(m.winner)} (${esc(m.winChar)})</span><span>vs</span><span class="match-lose">💀 ${esc(m.loser)} (${esc(m.loseChar)})</span><span style="color:#aaa">${m.date}</span></div>`;
  });
  html+=`</div>`;

  document.getElementById('lbContent').innerHTML=html;
}

// BACKGROUND CANVAS
// =============================================
(function initBgCanvas() {
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');
  let stars=[], W=0, H=0;

  function resize() {
    W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight;
    stars=[];
    for(let i=0;i<120;i++){
      stars.push({x:Math.random()*W,y:Math.random()*H*0.7,r:Math.random()*1.5+0.3,life:Math.random(),speed:Math.random()*0.003+0.001});
    }
  }
  window.addEventListener('resize',resize); resize();

  function drawCity() {
    const grad=ctx.createLinearGradient(0,H*0.7,0,H);
    grad.addColorStop(0,'rgba(10,10,30,0)');
    grad.addColorStop(1,'rgba(5,5,15,1)');
    ctx.fillStyle=grad; ctx.fillRect(0,H*0.7,W,H*0.3);
    ctx.fillStyle='#0a0a1e';
    const buildings=[0.1,0.2,0.15,0.3,0.25,0.2,0.35,0.15,0.18,0.28,0.12,0.22,0.3,0.16,0.24];
    const bw=W/buildings.length;
    buildings.forEach((h,i)=>{
      const bh=H*h;
      ctx.fillRect(i*bw,H-bh,bw-2,bh);
      // windows
      ctx.fillStyle='rgba(255,240,150,0.3)';
      for(let wy=H-bh+4;wy<H-4;wy+=10){
        for(let wx=i*bw+4;wx<(i+1)*bw-6;wx+=8){
          if(Math.random()<0.5) ctx.fillRect(wx,wy,4,6);
        }
      }
      ctx.fillStyle='#0a0a1e';
    });
  }

  function animate() {
    ctx.clearRect(0,0,W,H);
    // Sky gradient
    const sky=ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,'#020215'); sky.addColorStop(0.6,'#070720'); sky.addColorStop(1,'#0a0a1e');
    ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
    // Stars
    stars.forEach(s=>{
      s.life+=s.speed; if(s.life>1)s.life=0;
      const a=Math.sin(s.life*Math.PI)*0.8+0.2;
      ctx.globalAlpha=a; ctx.fillStyle='#ffffff';
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha=1;
    drawCity();
    requestAnimationFrame(animate);
  }
  animate();
})();

function getSkillTooltip(charName, skillKey) {
  const def = CHARACTERS[charName];
  if (!def) return '';
  const skills = { W: def.skill1, E: def.skill2, R: def.ult };
  const sk = skills[skillKey];
  if (!sk) return '';
  return `${sk.name}: ${sk.desc} (CD:${sk.cd}s, ${sk.mpCost}MP)`;
}

// =============================================
function renderCampaignProgress() {
  let html = '<div class="campaign-progress">';
  CAMPAIGN_STAGES.forEach((s, i) => {
    let cls = 'pending';
    if (i < campaignStage) cls = 'done';
    else if (i === campaignStage) cls = 'current';
    html += `<div class="stage-dot ${cls}">${i < campaignStage ? '✓' : i+1}</div>`;
  });
  html += '</div>';
  return html;
}

  const elapsed = Math.floor((Date.now() - battle.startTime) / 1000);
  return {
    elapsed,
    p1: {
      nick: battle.nicks[0],
      char: battle.fighters[0].charName,
      dmgDealt: battle.fighters[0].totalDmgDealt,
      dmgTaken: battle.fighters[0].totalDmgTaken,
      skills: battle.fighters[0].skillsUsed,
      normals: battle.fighters[0].normalsUsed,
      hp: battle.fighters[0].hp,
      hpPct: Math.round((battle.fighters[0].hp / battle.fighters[0].hpMax) * 100),
    },
    p2: {

// =============================================
// ENHANCED AI BEHAVIORS
// =============================================
function aiHellStrategy(ai, player, dc) {
  const now = Date.now();
  const hpRatio = ai.hp / ai.hpMax;
  const playerHpRatio = player.hp / player.hpMax;

  // Hell mode: prioritize healing when low
  if (hpRatio < 0.3 && ai.charName === '何熙') {
    if (now >= ai.cdEEnd && ai.mp >= ai.def.skill2.mpCost) {
      return 'E'; // Heal skill
    }
  }

  // Counter player's buff with debuff
  if (player.atkBuffUntil > now && now >= ai.cdWEnd && ai.mp >= ai.def.skill1.mpCost) {
    return 'W';
  }

  // Use shield when health is dropping
  if (hpRatio < 0.5 && ai.charName === '王雷') {
    if (now >= ai.cdEEnd && ai.mp >= ai.def.skill2.mpCost) {
      return 'E';
    }
  }

  // Aggressive ult when player is low
  if (playerHpRatio < 0.3 && now >= ai.cdREnd && ai.mp >= ai.def.ult.mpCost) {
    return 'R';
  }

  return null; // no special decision
}

function aiNormalStrategy(ai, player, dc) {
  const now = Date.now();
  const hpRatio = ai.hp / ai.hpMax;

  // Use ult when MP is full and health is ok
  if (ai.mp >= ai.mpMax * 0.8 && hpRatio > 0.4 && now >= ai.cdREnd) {
    return 'R';
  }

  // React to consecutive player attacks
  if (player.consecutiveNormalAtks >= 3) {
    if (now >= ai.cdWEnd && ai.mp >= ai.def.skill1.mpCost) {
      return 'W'; // Counter
    }
  }

  return null;
}

// =============================================
// SAVE & LOAD LOCAL PROGRESS
// =============================================
function saveLocalProgress(key, data) {
  try {
    localStorage.setItem('family-battle-' + key, JSON.stringify(data));
  } catch(e) { /* ignore */ }
}

function loadLocalProgress(key) {
  try {
    const d = localStorage.getItem('family-battle-' + key);
    return d ? JSON.parse(d) : null;
  } catch(e) { return null; }
}

// Save best score locally
function saveBestScore(nick, wins) {
  const best = loadLocalProgress('best') || {};
  if (!best[nick] || best[nick] < wins) {
    best[nick] = wins;
    saveLocalProgress('best', best);
  }
}

function restorePlayerHP(stage) {
  if (!battle) return;
  const healAmount = Math.floor(battle.fighters[0].hpMax * 0.3);
  battle.fighters[0].hp = Math.min(battle.fighters[0].hpMax, battle.fighters[0].hp + healAmount);
  logMsg(`💚 进入第${stage+1}关前，何熙恢复了${healAmount}点HP！`, 'heal');
  showHealEffect(0, healAmount);
  updateBars();
}

const comboSequences = {
  'QQQW': { name: '猛攻！', bonus: 1.5 },
  'WEQE': { name: '技巧连击', bonus: 1.3 },
};
let inputBuffer = '';
let bufferClearTimer = null;

function trackComboInput(key) {
  inputBuffer += key;
  if (inputBuffer.length > 4) inputBuffer = inputBuffer.slice(-4);
  clearTimeout(bufferClearTimer);
  bufferClearTimer = setTimeout(() => { inputBuffer = ''; }, 1500);
  // Check combos
  for (const [seq, effect] of Object.entries(comboSequences)) {
    if (inputBuffer.endsWith(seq)) {
      logMsg(`⚡ 连招「${effect.name}」触发！伤害×${effect.bonus}`, 'system');
      inputBuffer = '';
      break;
    }
  }
}

// =============================================
// DAMAGE FORMULA HELPERS
// =============================================
function calcCritical(baseDmg, critChance=0.1, critMult=1.5) {
  if (Math.random() < critChance) {
    return { dmg: Math.round(baseDmg * critMult), isCrit: true };
  }
  return { dmg: baseDmg, isCrit: false };
}

function calcMitigated(rawDmg, defenseRating=0) {
  // Simple linear mitigation (unused in core but available for extension)
  return Math.max(1, Math.round(rawDmg * (1 - defenseRating)));
}

// =============================================
// EXTENDED GIST DATA VALIDATION
// =============================================
function validateGistData(data) {
  if (!data || typeof data !== 'object') return false;
  if (!Array.isArray(data.leaderboard)) data.leaderboard = [];
  if (!Array.isArray(data.recentMatches)) data.recentMatches = [];
  if (!data.stats || typeof data.stats !== 'object') {
    data.stats = { totalGames:0, characterWins:{}, campaignClears:0 };
  }
  const charNames = Object.keys(CHARACTERS);
  charNames.forEach(n => {
    if (typeof data.stats.characterWins[n] !== 'number') {
      data.stats.characterWins[n] = 0;
    }
  });
  return true;
}

// =============================================
// STATUS EFFECT TICK CLEANUP
// =============================================
function tickStatusEffects() {
  if (!battle || !battle.running) return;
  const now = Date.now();
  battle.fighters.forEach((f, i) => {
    // Clear expired effects
    if (f.stunUntil > 0 && now >= f.stunUntil) {
      if (f.stunUntil + 100 > now) logMsg(`💨 ${f.charName} 从眩晕中恢复！`, 'system');
    }
    if (f.fatigueActive && now >= f.fatigueTick) {
      if (!f._fatigueClearedLogged) {
        f._fatigueClearedLogged = true;
        logMsg(`😤 ${f.charName} 已从疲劳中恢复！`, 'system');
      }
    } else {
      f._fatigueClearedLogged = false;
    }
  });
}

];

function checkAchievements(matchStats) {
  const saved = loadLocalProgress('achievements') || {};
  const newlyUnlocked = [];
  ACHIEVEMENTS.forEach(ach => {
    if (!saved[ach.id] && ach.check(matchStats)) {
      saved[ach.id] = true;
      newlyUnlocked.push(ach);
    }
  });
  if (newlyUnlocked.length > 0) {
    saveLocalProgress('achievements', saved);
    newlyUnlocked.forEach(ach => {
      showAchievementToast(ach);
    });
  }
}

function showAchievementToast(ach) {
  const toast = document.createElement('div');
  toast.style.cssText = `
    position:fixed;bottom:80px;right:16px;z-index:500;
    background:linear-gradient(135deg,#ffd700,#ff8f00);
    color:#000;padding:12px 18px;border-radius:12px;
    font-weight:700;font-size:14px;
    box-shadow:0 4px 20px rgba(255,215,0,0.5);
    animation:effectFade 0.4s ease-in forwards;
    max-width:220px;
  `;
  toast.innerHTML = `🏅 成就解锁！<br><strong>${esc(ach.name)}</strong><br><small>${esc(ach.desc)}</small>`;

  setTimeout(() => toast.remove(), 4000);
}
