<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>家庭格斗大战</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Microsoft YaHei', sans-serif; overflow: hidden; }
#gameContainer { position: relative; width: 800px; max-width: 100vw; }
#gameCanvas { display: block; width: 100%; image-rendering: pixelated; border: 3px solid #444; border-radius: 4px; box-shadow: 0 0 30px rgba(255,200,0,0.3); }
#ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
/* Mobile controls */
#mobileControls { display: none; position: absolute; bottom: 0; left: 0; width: 100%; height: 160px; pointer-events: all; }
#joystickArea { position: absolute; left: 20px; bottom: 20px; width: 120px; height: 120px; }
#joystickBase { position: absolute; width: 100px; height: 100px; border-radius: 50%; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3); left: 10px; top: 10px; }
#joystickKnob { position: absolute; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.5); border: 2px solid white; left: 28px; top: 28px; transition: none; }
#skillButtons { position: absolute; right: 20px; bottom: 20px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px; width: 140px; height: 140px; }
.skillBtn { border-radius: 50%; border: 2px solid rgba(255,255,255,0.5); font-size: 16px; font-weight: bold; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; -webkit-user-select: none; }
.skillBtn.j { background: rgba(80,200,80,0.6); }
.skillBtn.k { background: rgba(80,80,200,0.6); }
.skillBtn.l { background: rgba(200,180,0,0.6); }
.skillBtn.u { background: rgba(200,50,50,0.6); }
#jumpBtn { position: absolute; right: 180px; bottom: 80px; width: 60px; height: 60px; border-radius: 50%; background: rgba(200,200,200,0.4); border: 2px solid rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; cursor: pointer; }
@media (max-width: 800px) { #mobileControls { display: block; } #gameContainer { width: 100vw; } }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas" width="800" height="450"></canvas>
  <div id="mobileControls">
    <div id="joystickArea">
      <div id="joystickBase"></div>
      <div id="joystickKnob"></div>
    </div>
    <div id="jumpBtn">↑</div>
    <div id="skillButtons">
      <div class="skillBtn j" data-action="j">攻</div>
      <div class="skillBtn k" data-action="k">技1</div>
      <div class="skillBtn l" data-action="l">技2</div>
      <div class="skillBtn u" data-action="u">大招</div>
    </div>
  </div>
</div>
<script>
// ============================================================
// CONSTANTS & CONFIG
// ============================================================
const W = 800, H = 450;
const GROUND_Y = H - 80;
const GRAVITY = 0.6;
const JUMP_FORCE = -14;
const MOVE_SPEED = 4;

const JSONBIN_ID = '69c92d966860e0745b0056b9';
const JSONBIN_KEY = ['$2a$10$NGSlB0FRVPEG4PoI1XAzj','.KXSCrzcOCI0j/GIbUXeww8bvkl9mfnO'].join('');
const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_ID}`;
const JSONBIN_LATEST = `${JSONBIN_URL}/latest`;

// ============================================================
// CHARACTER DEFINITIONS
// ============================================================
const CHAR_DEFS = {
  heli: {
    name: '何丽', emoji: '👩‍🍳', hp: 1200,
    color: '#ff9ff3',
    moves: {
      normal: { name: '平底锅横扫', type: 'melee', dmgMin: 60, dmgMax: 80, range: 90, startup: 200, cooldown: 500 },
      skill1: { name: '严父凝视', type: 'stun', dmg: 40, range: 100, duration: 1500, startup: 300, cooldown: 3000 },
      skill2: { name: '家务风暴', type: 'combo3', dmg: 45, range: 80, startup: 150, cooldown: 4000 },
      ultimate: { name: '全家之怒', type: 'screen', dmg: 200, startup: 500, cooldown: 8000, shake: true }
    }
  },
  wanglei: {
    name: '王雷', emoji: '👨‍🦱', hp: 1400,
    color: '#54a0ff',
    moves: {
      normal: { name: '重拳', type: 'melee', dmgMin: 70, dmgMax: 100, range: 85, startup: 250, cooldown: 600, knockback: 80 },
      skill1: { name: '护妻冲撞', type: 'dash', dmg: 80, range: 200, startup: 200, cooldown: 4000, knockback: 120 },
      skill2: { name: '坚实守护', type: 'invincible', duration: 2000, startup: 100, cooldown: 6000 },
      ultimate: { name: '雷霆一击', type: 'screen', dmg: 250, startup: 600, cooldown: 10000, shake: true }
    }
  },
  zhuyan: {
    name: '朱艳', emoji: '👩‍🎤', hp: 900,
    color: '#ff6b9d',
    moves: {
      normal: { name: '快速掌击', type: 'double', dmgMin: 50, dmgMax: 70, range: 75, startup: 120, cooldown: 400 },
      skill1: { name: '魅影闪', type: 'teleport', dmg: 100, startup: 200, cooldown: 5000 },
      skill2: { name: '情侣羁绊', type: 'speedbuff', duration: 4000, startup: 100, cooldown: 6000 },
      ultimate: { name: '艳影绝杀', type: 'combo5', dmg: 40, range: 80, startup: 100, cooldown: 9000 }
    }
  },
  hewei: {
    name: '何蔚', emoji: '👨‍🎓', hp: 1000,
    color: '#00d2d3',
    moves: {
      normal: { name: '组合拳', type: 'melee', dmgMin: 55, dmgMax: 75, range: 85, startup: 220, cooldown: 500 },
      skill1: { name: '护花格挡', type: 'block', duration: 3000, startup: 100, cooldown: 5000 },
      skill2: { name: '温柔鼓舞', type: 'attackbuff', duration: 4000, startup: 150, cooldown: 5000 },
      ultimate: { name: '同心合击', type: 'knockup', dmg: 220, range: 100, startup: 400, cooldown: 9000 }
    }
  },
  hexi: {
    name: '何熙', emoji: '👧', hp: 850,
    color: '#ffd32a',
    moves: {
      normal: { name: '魔法弹', type: 'projectile', dmgMin: 40, dmgMax: 60, speed: 8, startup: 180, cooldown: 400 },
      skill1: { name: '淘气干扰', type: 'slowball', dmg: 30, speed: 5, startup: 200, cooldown: 4000, slowDur: 2000 },
      skill2: { name: '姐妹同心', type: 'heal', amount: 80, startup: 200, cooldown: 5000 },
      ultimate: { name: '元气爆冲', type: 'wave', dmg: 230, startup: 400, cooldown: 9000 }
    }
  }
};

const CHAR_ORDER = ['heli','wanglei','zhuyan','hewei','hexi'];
const STORY_ORDER = ['heli','wanglei','zhuyan','hewei']; // bosses for story mode

// ============================================================
// GAME STATE
// ============================================================
let gameState = 'menu'; // menu, charselect, diffselect, fight, result, story
let selectedChars = [null, null];
let selectingPlayer = 0;
let gameMode = 'single'; // single, pvp, story
let difficulty = 'normal';
let storyBossIndex = 0;
let roundTimer = 60;
let roundTimerMs = 60000;
let winnerSide = null;
let scores = { p1: 0, p2: 0 };
let recordData = null;

let fighters = [];
let projectiles = [];
let effects = [];
let screenShake = { x: 0, y: 0, dur: 0 };
let comboCount = { p1: 0, p2: 0 };
let comboTimer = { p1: 0, p2: 0 };

const keys = {};
const prevKeys = {};

// ============================================================
// CANVAS SETUP
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// ============================================================
// INPUT
// ============================================================
const KEY_MAP = {
  'KeyA': 'p1_left', 'KeyD': 'p1_right', 'KeyW': 'p1_jump', 'Space': 'p1_jump',
  'KeyJ': 'p1_normal', 'KeyK': 'p1_skill1', 'KeyL': 'p1_skill2', 'KeyU': 'p1_ult',
  'ArrowLeft': 'p2_left', 'ArrowRight': 'p2_right', 'ArrowUp': 'p2_jump',
  'Numpad1': 'p2_normal', 'Digit1': 'p2_normal',
  'Numpad2': 'p2_skill1', 'Digit2': 'p2_skill1',
  'Numpad3': 'p2_skill2', 'Digit3': 'p2_skill2',
  'Numpad4': 'p2_ult', 'Digit4': 'p2_ult',
};

document.addEventListener('keydown', e => {
  const action = KEY_MAP[e.code];
  if (action) { keys[action] = true; e.preventDefault(); }
  if (e.code === 'Enter' || e.code === 'NumpadEnter') { keys['enter'] = true; e.preventDefault(); }
  if (e.code === 'Escape') { keys['esc'] = true; e.preventDefault(); }
});
document.addEventListener('keyup', e => {
  const action = KEY_MAP[e.code];
  if (action) keys[action] = false;
  if (e.code === 'Enter' || e.code === 'NumpadEnter') keys['enter'] = false;
  if (e.code === 'Escape') keys['esc'] = false;
});

function keyPressed(k) { return keys[k] && !prevKeys[k]; }

// ============================================================
// MOBILE CONTROLS
// ============================================================
const joystickArea = document.getElementById('joystickArea');
const joystickBase = document.getElementById('joystickBase');
const joystickKnob = document.getElementById('joystickKnob');
const jumpBtn = document.getElementById('jumpBtn');
const skillButtons = document.querySelectorAll('.skillBtn');

let joystickActive = false;
let joystickOrigin = { x: 0, y: 0 };
const JOYSTICK_RADIUS = 38;

joystickArea.addEventListener('touchstart', e => {
  e.preventDefault();
  joystickActive = true;
  const t = e.touches[0];
  const rect = joystickBase.getBoundingClientRect();
  joystickOrigin = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
}, { passive: false });

joystickArea.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!joystickActive) return;
  const t = e.touches[0];
  const dx = t.clientX - joystickOrigin.x;
  const dy = t.clientY - joystickOrigin.y;
  const dist = Math.min(JOYSTICK_RADIUS, Math.hypot(dx, dy));
  const angle = Math.atan2(dy, dx);
  const kx = Math.cos(angle) * dist;
  const ky = Math.sin(angle) * dist;
  joystickKnob.style.left = (28 + kx) + 'px';
  joystickKnob.style.top = (28 + ky) + 'px';
  keys['p1_left'] = dx < -15;
  keys['p1_right'] = dx > 15;
}, { passive: false });

joystickArea.addEventListener('touchend', e => {
  e.preventDefault();
  joystickActive = false;
  joystickKnob.style.left = '28px';
  joystickKnob.style.top = '28px';
  keys['p1_left'] = false;
  keys['p1_right'] = false;
}, { passive: false });

jumpBtn.addEventListener('touchstart', e => { e.preventDefault(); keys['p1_jump'] = true; }, { passive: false });
jumpBtn.addEventListener('touchend', e => { e.preventDefault(); keys['p1_jump'] = false; }, { passive: false });

skillButtons.forEach(btn => {
  btn.addEventListener('touchstart', e => {
    e.preventDefault();
    const a = btn.dataset.action;
    if (a === 'j') keys['p1_normal'] = true;
    else if (a === 'k') keys['p1_skill1'] = true;
    else if (a === 'l') keys['p1_skill2'] = true;
    else if (a === 'u') keys['p1_ult'] = true;
  }, { passive: false });
  btn.addEventListener('touchend', e => {
    e.preventDefault();
    const a = btn.dataset.action;
    if (a === 'j') keys['p1_normal'] = false;
    else if (a === 'k') keys['p1_skill1'] = false;
    else if (a === 'l') keys['p1_skill2'] = false;
    else if (a === 'u') keys['p1_ult'] = false;
  }, { passive: false });
});

// ============================================================
// FIGHTER CLASS
// ============================================================
class Fighter {
  constructor(charId, side, x) {
    const def = CHAR_DEFS[charId];
    this.charId = charId;
    this.side = side; // 'p1' or 'p2'
    this.name = def.name;
    this.emoji = def.emoji;
    this.color = def.color;
    this.maxHp = def.hp;
    this.hp = def.hp;
    this.x = x;
    this.y = GROUND_Y;
    this.vx = 0;
    this.vy = 0;
    this.w = 60;
    this.h = 80;
    this.onGround = true;
    this.facing = side === 'p1' ? 1 : -1; // 1=right, -1=left
    this.state = 'idle'; // idle, walk, jump, attack, hurt, down, stun
    this.stateTimer = 0;
    this.attackTimer = 0;
    this.hurtTimer = 0;
    this.stunTimer = 0;
    this.invincibleTimer = 0;
    this.blocking = false;
    this.blockTimer = 0;
    this.dead = false;
    this.won = false;
    this.moves = def.moves;
    this.cooldowns = { normal: 0, skill1: 0, skill2: 0, ultimate: 0 };
    this.buffs = { speed: 1, attack: 1, speedDur: 0, attackDur: 0 };
    this.comboCount = 0;
    this.comboWindow = 0;
    this.slowTimer = 0;
    // Animation
    this.animOffset = { x: 0, y: 0 };
    this.animTimer = 0;
    this.flashRed = 0;
    this.celebrateTimer = 0;
    this.isAI = false;
    this.aiTimer = 0;
    this.aiState = 'chase';
  }

  get cx() { return this.x + this.w / 2; }
  get cy() { return this.y + this.h / 2; }
  get foot() { return this.y + this.h; }

  distanceTo(other) {
    return Math.abs(this.cx - other.cx);
  }

  update(dt, opponent) {
    // Cooldowns
    for (const k in this.cooldowns) {
      if (this.cooldowns[k] > 0) this.cooldowns[k] = Math.max(0, this.cooldowns[k] - dt);
    }
    // Buffs
    if (this.buffs.speedDur > 0) { this.buffs.speedDur -= dt; if (this.buffs.speedDur <= 0) this.buffs.speed = 1; }
    if (this.buffs.attackDur > 0) { this.buffs.attackDur -= dt; if (this.buffs.attackDur <= 0) this.buffs.attack = 1; }
    // Timers
    if (this.stateTimer > 0) this.stateTimer -= dt;
    if (this.hurtTimer > 0) { this.hurtTimer -= dt; if (this.hurtTimer <= 0 && this.state === 'hurt') this.state = 'idle'; }
    if (this.stunTimer > 0) { this.stunTimer -= dt; if (this.stunTimer <= 0 && this.state === 'stun') this.state = 'idle'; }
    if (this.invincibleTimer > 0) this.invincibleTimer -= dt;
    if (this.blockTimer > 0) { this.blockTimer -= dt; if (this.blockTimer <= 0) this.blocking = false; }
    if (this.flashRed > 0) this.flashRed -= dt;
    if (this.slowTimer > 0) this.slowTimer -= dt;
    if (this.comboWindow > 0) { this.comboWindow -= dt; if (this.comboWindow <= 0) this.comboCount = 0; }
    if (this.celebrateTimer > 0) this.celebrateTimer -= dt;

    // Gravity
    if (!this.onGround) {
      this.vy += GRAVITY;
    }
    // Move
    if (this.state !== 'attack' || this.animTimer <= 0) {
      this.x += this.vx;
    }
    this.y += this.vy;

    // Friction
    if (this.onGround) this.vx *= 0.7;

    // Ground check
    if (this.foot >= GROUND_Y) {
      this.y = GROUND_Y - this.h;
      this.vy = 0;
      if (!this.onGround) {
        this.onGround = true;
        if (this.state === 'jump') this.state = 'idle';
      }
    } else {
      this.onGround = false;
    }

    // Wall bounds
    if (this.x < 0) { this.x = 0; this.vx = 0; }
    if (this.x + this.w > W) { this.x = W - this.w; this.vx = 0; }

    // Facing
    if (opponent && this.state !== 'attack' && this.state !== 'stun') {
      this.facing = opponent.cx > this.cx ? 1 : -1;
    }

    // Animate attack offset
    if (this.animTimer > 0) {
      this.animTimer -= dt;
      const progress = 1 - this.animTimer / this.animDuration;
      if (progress < 0.5) {
        this.animOffset.x = this.facing * 20 * (progress / 0.5);
      } else {
        this.animOffset.x = this.facing * 20 * (1 - (progress - 0.5) / 0.5);
      }
    } else {
      this.animOffset.x = 0;
    }

    // State transitions
    if (this.state === 'idle' || this.state === 'walk') {
      if (!this.onGround) this.state = 'jump';
    }
  }

  tryJump() {
    if (this.onGround && this.state !== 'attack' && this.state !== 'stun' && this.state !== 'hurt') {
      this.vy = JUMP_FORCE;
      this.onGround = false;
      this.state = 'jump';
    }
  }

  tryMove(dir) {
    if (this.state === 'attack' || this.state === 'stun' || this.state === 'down') return;
    const spd = MOVE_SPEED * this.buffs.speed * (this.slowTimer > 0 ? 0.4 : 1);
    this.vx = dir * spd;
    if (this.onGround) this.state = 'walk';
  }

  stopMove() {
    if (this.state === 'walk') {
      this.vx = 0;
      this.state = 'idle';
    }
  }

  tryAttack(type, opponent, projectileList, effectList) {
    if (this.state === 'stun' || this.state === 'down' || this.dead) return false;
    if (this.cooldowns[type] > 0) return false;
    const move = this.moves[type === 'normal' ? 'normal' : type === 'skill1' ? 'skill1' : type === 'skill2' ? 'skill2' : 'ultimate'];
    if (!move) return false;

    this.state = 'attack';
    this.stateTimer = move.startup || 300;
    this.animDuration = move.startup || 300;
    this.animTimer = this.animDuration;
    this.cooldowns[type] = move.cooldown || 1000;

    const attackMultiplier = this.buffs.attack;

    if (type === 'normal') {
      // Combo tracking
      if (this.comboWindow > 0) {
        this.comboCount++;
      } else {
        this.comboCount = 1;
      }
      this.comboWindow = 800;
    }

    // Execute attack
    setTimeout(() => {
      if (this.dead) return;
      this.executeAttack(type, move, opponent, projectileList, effectList, attackMultiplier);
      this.state = 'idle';
    }, move.startup || 300);

    return true;
  }

  executeAttack(type, move, opponent, projectileList, effectList, atkMult) {
    const mt = move.type;
    const dist = this.distanceTo(opponent);

    if (mt === 'melee' || mt === 'double') {
      const range = move.range || 90;
      if (dist <= range) {
        let dmg = Math.round((move.dmgMin + Math.random() * (move.dmgMax - move.dmgMin)) * atkMult);
        if (type === 'normal' && this.comboCount >= 3) dmg *= 2;
        this.dealDamage(opponent, dmg, move.knockback || 30, effectList);
        if (mt === 'double') {
          setTimeout(() => {
            if (!opponent.dead && dist <= range + 20) {
              let dmg2 = Math.round((move.dmgMin + Math.random() * (move.dmgMax - move.dmgMin)) * atkMult);
              this.dealDamage(opponent, dmg2, 20, effectList);
            }
          }, 180);
        }
      }
    } else if (mt === 'stun') {
      if (dist <= move.range) {
        this.dealDamage(opponent, move.dmg * atkMult, 0, effectList);
        if (!opponent.invincibleTimer || opponent.invincibleTimer <= 0) {
          opponent.stunTimer = move.duration;
          opponent.state = 'stun';
        }
        effectList.push(new Effect('stun', opponent.cx, opponent.cy, 2000));
      }
    } else if (mt === 'combo3') {
      for (let i = 0; i < 3; i++) {
        setTimeout(() => {
          if (!opponent.dead && this.distanceTo(opponent) <= move.range + 20) {
            this.dealDamage(opponent, move.dmg * atkMult, 15, effectList);
          }
        }, i * 150);
      }
    } else if (mt === 'screen') {
      this.dealDamage(opponent, move.dmg * atkMult, 60, effectList);
      if (move.shake) {
        screenShake.dur = 500;
        screenShake.x = 12;
        screenShake.y = 8;
      }
      effectList.push(new Effect('explosion', W / 2, H / 2, 800));
    } else if (mt === 'dash') {
      // Dash forward
      this.x += this.facing * 150;
      if (this.x < 0) this.x = 0;
      if (this.x + this.w > W) this.x = W - this.w;
      if (this.distanceTo(opponent) <= move.range) {
        this.dealDamage(opponent, move.dmg * atkMult, move.knockback || 100, effectList);
      }
      effectList.push(new Effect('dash', this.cx, this.cy, 400));
    } else if (mt === 'invincible') {
      this.invincibleTimer = move.duration;
      effectList.push(new Effect('shield', this.cx, this.cy, move.duration));
    } else if (mt === 'teleport') {
      // Teleport behind opponent
      const behind = opponent.cx - opponent.facing * 80;
      this.x = Math.max(0, Math.min(W - this.w, behind - this.w / 2));
      this.dealDamage(opponent, move.dmg * atkMult, 40, effectList);
      effectList.push(new Effect('teleport', this.cx, this.cy, 500));
    } else if (mt === 'speedbuff') {
      this.buffs.speed = 1.6;
      this.buffs.speedDur = move.duration;
      this.buffs.attack = 1.3;
      this.buffs.attackDur = move.duration;
      effectList.push(new Effect('buff', this.cx, this.cy, move.duration));
    } else if (mt === 'combo5') {
      for (let i = 0; i < 5; i++) {
        setTimeout(() => {
          if (!opponent.dead && this.distanceTo(opponent) <= move.range + 30) {
            this.dealDamage(opponent, move.dmg * atkMult, 10, effectList);
          }
        }, i * 100);
      }
      effectList.push(new Effect('slash5', this.cx, this.cy, 600));
    } else if (mt === 'block') {
      this.blocking = true;
      this.blockTimer = move.duration;
      effectList.push(new Effect('shield', this.cx, this.cy, move.duration));
    } else if (mt === 'attackbuff') {
      this.buffs.attack = 1.5;
      this.buffs.attackDur = move.duration;
      this.buffs.speed = 1.3;
      this.buffs.speedDur = move.duration;
      effectList.push(new Effect('buff', this.cx, this.cy, move.duration));
    } else if (mt === 'knockup') {
      if (dist <= move.range) {
        this.dealDamage(opponent, move.dmg * atkMult, 0, effectList);
        opponent.vy = -18;
        opponent.onGround = false;
        if (move.shake) { screenShake.dur = 400; screenShake.x = 10; screenShake.y = 10; }
        effectList.push(new Effect('explosion', opponent.cx, opponent.cy, 600));
      }
    } else if (mt === 'projectile') {
      const dmg = Math.round((move.dmgMin + Math.random() * (move.dmgMax - move.dmgMin)) * atkMult);
      projectileList.push(new Projectile(this.cx, this.cy, this.facing * move.speed, 0, dmg, this.side, '✨', false, 0));
    } else if (mt === 'slowball') {
      projectileList.push(new Projectile(this.cx, this.cy, this.facing * move.speed, 0, move.dmg * atkMult, this.side, '🌀', true, move.slowDur));
    } else if (mt === 'heal') {
      this.hp = Math.min(this.maxHp, this.hp + move.amount);
      effectList.push(new Effect('heal', this.cx, this.cy, 800));
    } else if (mt === 'wave') {
      // Wave expanding
      effectList.push(new Effect('wave', this.cx, this.cy, 800));
      // Damage opponent in range
      setTimeout(() => {
        if (!opponent.dead) this.dealDamage(opponent, move.dmg * atkMult, 80, effectList);
        if (move.shake) { screenShake.dur = 500; screenShake.x = 14; screenShake.y = 10; }
      }, 200);
    }
  }

  dealDamage(target, dmg, knockback, effectList) {
    if (target.dead) return;
    if (target.invincibleTimer > 0) return;
    if (target.blocking) {
      // Block reduces damage
      dmg = Math.round(dmg * 0.15);
      target.blocking = false;
      target.blockTimer = 0;
      effectList.push(new Effect('block', target.cx, target.cy, 400));
    }
    target.hp = Math.max(0, target.hp - dmg);
    target.flashRed = 200;
    if (knockback > 0) {
      target.vx = -this.facing * knockback * 0.15;
    }
    if (target.state !== 'stun' && !target.dead) {
      target.state = 'hurt';
      target.hurtTimer = 300;
    }
    effectList.push(new HitNumber(dmg, target.cx, target.cy - 20));
    if (target.hp <= 0) {
      target.hp = 0;
      target.dead = true;
      target.state = 'down';
    }
  }

  // AI Logic
  updateAI(dt, opponent, projectileList, effectList) {
    if (!this.isAI || this.dead) return;
    this.aiTimer -= dt;
    if (this.aiTimer > 0) return;

    const dist = this.distanceTo(opponent);
    const lowHp = this.hp < this.maxHp * 0.3;

    if (this.state === 'stun' || this.state === 'hurt' || this.state === 'down') {
      this.aiTimer = 200;
      return;
    }

    // Decide action
    const diff = difficulty === 'easy' ? 0.4 : difficulty === 'normal' ? 0.65 : 0.9;
    const roll = Math.random();

    if (lowHp && dist < 200) {
      // Retreat
      const dir = opponent.cx > this.cx ? -1 : 1;
      this.tryMove(dir);
      this.aiTimer = 300;
    } else if (dist < 85 && roll < diff) {
      // Attack
      this.vx = 0;
      if (this.state === 'walk') this.state = 'idle';
      const actionRoll = Math.random();
      if (actionRoll < 0.5 && this.cooldowns.normal <= 0) {
        this.tryAttack('normal', opponent, projectileList, effectList);
      } else if (actionRoll < 0.7 && this.cooldowns.skill1 <= 0) {
        this.tryAttack('skill1', opponent, projectileList, effectList);
      } else if (actionRoll < 0.85 && this.cooldowns.skill2 <= 0) {
        this.tryAttack('skill2', opponent, projectileList, effectList);
      } else if (this.cooldowns.ultimate <= 0 && roll < diff * 0.3) {
        this.tryAttack('ultimate', opponent, projectileList, effectList);
      } else if (this.cooldowns.normal <= 0) {
        this.tryAttack('normal', opponent, projectileList, effectList);
      }
      this.aiTimer = 400 + Math.random() * 400;
    } else if (dist > 85) {
      // Chase
      const dir = opponent.cx > this.cx ? 1 : -1;
      this.tryMove(dir);
      if (this.onGround && Math.random() < 0.05) this.tryJump();
      this.aiTimer = 100;
    } else {
      this.aiTimer = 200;
    }

    // Projectile character: attack from range
    if (this.charId === 'hexi' && dist > 100 && dist < 400 && this.cooldowns.normal <= 0 && roll < diff) {
      this.vx = 0;
      this.tryAttack('normal', opponent, projectileList, effectList);
      this.aiTimer = 600;
    }
  }

  draw(ctx) {
    const px = this.x + this.animOffset.x;
    const py = this.y + this.animOffset.y;

    ctx.save();

    // Flash red on hurt
    if (this.flashRed > 0) {
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(Date.now() * 0.05);
    }

    // Down state
    if (this.state === 'down') {
      ctx.save();
      ctx.translate(px + this.w / 2, py + this.h);
      ctx.rotate(Math.PI / 2);
      ctx.font = '60px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      if (this.flashRed > 0) {
        ctx.filter = 'sepia(1) saturate(5) hue-rotate(310deg)';
      }
      ctx.fillText(this.emoji, 0, 0);
      ctx.restore();
      ctx.restore();
      return;
    }

    // Mirror facing
    ctx.translate(px + this.w / 2, py + this.h / 2);
    if (this.facing === -1) ctx.scale(-1, 1);

    // Stun effect
    if (this.state === 'stun') {
      ctx.globalAlpha = 0.7 + 0.3 * Math.sin(Date.now() * 0.01);
    }

    // Flash red filter
    if (this.flashRed > 0) {
      ctx.filter = 'sepia(1) saturate(5) hue-rotate(310deg)';
    }

    // Invincible glow
    if (this.invincibleTimer > 0) {
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 20;
    }

    // Buff glow
    if (this.buffs.speedDur > 0 || this.buffs.attackDur > 0) {
      ctx.shadowColor = this.buffs.attackDur > 0 ? '#ff9900' : '#00ff99';
      ctx.shadowBlur = 15;
    }

    // Celebrate bounce
    let celebrateY = 0;
    if (this.celebrateTimer > 0) {
      celebrateY = Math.sin(Date.now() * 0.01) * 8;
    }

    // Emoji
    ctx.font = '60px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.emoji, 0, celebrateY);

    // Attack indicator
    if (this.state === 'attack') {
      ctx.font = '20px serif';
      ctx.fillText('💥', 40, -20);
    }

    // Stun stars
    if (this.state === 'stun') {
      const t = Date.now() * 0.003;
      for (let i = 0; i < 3; i++) {
        const a = t + (i / 3) * Math.PI * 2;
        ctx.font = '14px serif';
        ctx.fillText('⭐', Math.cos(a) * 35, -45 + Math.sin(a) * 10);
      }
    }

    ctx.restore();

    // Blocking shield
    if (this.blocking) {
      ctx.save();
      ctx.globalAlpha = 0.6;
      ctx.fillStyle = '#00ccff';
      ctx.beginPath();
      ctx.arc(px + this.w / 2, py + this.h / 2, 45, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
}

// ============================================================
// PROJECTILE CLASS
// ============================================================
class Projectile {
  constructor(x, y, vx, vy, dmg, owner, emoji, isSlow, slowDur) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.dmg = dmg;
    this.owner = owner; // 'p1' or 'p2'
    this.emoji = emoji;
    this.isSlow = isSlow;
    this.slowDur = slowDur || 0;
    this.alive = true;
    this.w = 20; this.h = 20;
    this.lifetime = 3000;
  }

  update(dt, fighters, effectList) {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.1; // slight gravity
    this.lifetime -= dt;
    if (this.lifetime <= 0) { this.alive = false; return; }
    if (this.x < 0 || this.x > W) { this.alive = false; return; }

    // Collision with opponent
    for (const f of fighters) {
      if (f.side === this.owner || f.dead) continue;
      if (this.x > f.x - 10 && this.x < f.x + f.w + 10 && this.y > f.y && this.y < f.y + f.h) {
        if (f.invincibleTimer <= 0) {
          f.hp = Math.max(0, f.hp - this.dmg);
          f.flashRed = 200;
          f.state = 'hurt';
          f.hurtTimer = 200;
          if (this.isSlow) f.slowTimer = this.slowDur;
          if (f.hp <= 0) { f.hp = 0; f.dead = true; f.state = 'down'; }
          effectList.push(new HitNumber(this.dmg, this.x, this.y));
          effectList.push(new Effect('hit', this.x, this.y, 300));
        }
        this.alive = false;
        return;
      }
    }
  }

  draw(ctx) {
    ctx.font = '22px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.emoji, this.x, this.y);
  }
}

// ============================================================
// EFFECT CLASS
// ============================================================
class Effect {
  constructor(type, x, y, duration) {
    this.type = type;
    this.x = x; this.y = y;
    this.duration = duration;
    this.maxDuration = duration;
    this.alive = true;
    this.radius = 0;
  }

  update(dt) {
    this.duration -= dt;
    if (this.duration <= 0) this.alive = false;
  }

  draw(ctx) {
    const t = 1 - this.duration / this.maxDuration;
    const alpha = this.duration / this.maxDuration;
    ctx.save();
    ctx.globalAlpha = alpha;

    if (this.type === 'explosion') {
      const r = t * 150;
      const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r);
      grad.addColorStop(0, 'rgba(255,200,0,1)');
      grad.addColorStop(0.5, 'rgba(255,80,0,0.6)');
      grad.addColorStop(1, 'rgba(255,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
      ctx.fill();
    } else if (this.type === 'hit') {
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(this.x, this.y, 20 * t, 0, Math.PI * 2);
      ctx.fill();
    } else if (this.type === 'stun') {
      ctx.font = `${18 + t * 10}px serif`;
      ctx.textAlign = 'center';
      ctx.fillText('💫', this.x, this.y - 60);
    } else if (this.type === 'shield') {
      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(this.x, this.y, 50 + t * 20, 0, Math.PI * 2);
      ctx.stroke();
    } else if (this.type === 'dash') {
      ctx.fillStyle = `rgba(100,200,255,${alpha})`;
      for (let i = 0; i < 5; i++) {
        ctx.fillRect(this.x - i * 15, this.y - 10, 8, 20);
      }
    } else if (this.type === 'teleport') {
      ctx.fillStyle = `rgba(200,100,255,${alpha})`;
      ctx.beginPath();
      ctx.arc(this.x, this.y, 40 * (1 - t), 0, Math.PI * 2);
      ctx.fill();
    } else if (this.type === 'buff') {
      ctx.font = `${20 + t * 15}px serif`;
      ctx.textAlign = 'center';
      ctx.fillText('✨', this.x + Math.sin(t * 20) * 20, this.y - 30 - t * 40);
    } else if (this.type === 'heal') {
      ctx.fillStyle = `rgba(0,255,100,${alpha})`;
      ctx.font = '28px serif';
      ctx.textAlign = 'center';
      ctx.fillText('💚', this.x, this.y - t * 50);
    } else if (this.type === 'wave') {
      const r = t * 300;
      ctx.strokeStyle = `rgba(255,200,255,${alpha})`;
      ctx.lineWidth = 8 * (1 - t);
      ctx.beginPath();
      ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
      ctx.stroke();
    } else if (this.type === 'slash5') {
      for (let i = 0; i < 5; i++) {
        ctx.strokeStyle = `rgba(255,100,200,${alpha})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(this.x - 40 + i * 20, this.y - 30);
        ctx.lineTo(this.x - 20 + i * 20, this.y + 30);
        ctx.stroke();
      }
    } else if (this.type === 'block') {
      ctx.strokeStyle = '#ffff00';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(this.x, this.y, 50, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }
}

// ============================================================
// HIT NUMBER
// ============================================================
class HitNumber {
  constructor(value, x, y) {
    this.value = Math.round(value);
    this.x = x; this.y = y;
    this.vy = -2;
    this.duration = 800;
    this.maxDuration = 800;
    this.alive = true;
  }

  update(dt) {
    this.y += this.vy;
    this.vy *= 0.97;
    this.duration -= dt;
    if (this.duration <= 0) this.alive = false;
  }

  draw(ctx) {
    const alpha = this.duration / this.maxDuration;
    const scale = this.value >= 150 ? 1.5 : this.value >= 100 ? 1.2 : 1;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = `bold ${Math.round(24 * scale)}px Arial`;
    ctx.textAlign = 'center';
    ctx.fillStyle = this.value >= 150 ? '#ff4400' : this.value >= 100 ? '#ffaa00' : '#ffffff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeText(this.value, this.x, this.y);
    ctx.fillText(this.value, this.x, this.y);
    ctx.restore();
  }
}

// ============================================================
// DRAWING HELPERS
// ============================================================
function drawBackground() {
  // Sky gradient
  const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  skyGrad.addColorStop(0, '#1a1a4e');
  skyGrad.addColorStop(0.5, '#2d4a7a');
  skyGrad.addColorStop(1, '#4a7a9b');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, GROUND_Y);

  // Stars
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  const starPositions = [[50,30],[150,20],[300,45],[450,15],[600,35],[720,25],[780,50],[100,60],[380,10],[680,55]];
  for (const [sx, sy] of starPositions) {
    ctx.beginPath();
    ctx.arc(sx, sy, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Moon
  ctx.fillStyle = '#fffde7';
  ctx.beginPath();
  ctx.arc(700, 50, 25, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#2d4a7a';
  ctx.beginPath();
  ctx.arc(710, 45, 20, 0, Math.PI * 2);
  ctx.fill();

  // Ground
  const groundGrad = ctx.createLinearGradient(0, GROUND_Y, 0, H);
  groundGrad.addColorStop(0, '#4a3728');
  groundGrad.addColorStop(0.3, '#6b5040');
  groundGrad.addColorStop(1, '#3a2820');
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

  // Ground line
  ctx.strokeStyle = '#8b6914';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  ctx.lineTo(W, GROUND_Y);
  ctx.stroke();

  // Floor tiles
  ctx.strokeStyle = 'rgba(139,105,20,0.4)';
  ctx.lineWidth = 1;
  for (let tx = 0; tx < W; tx += 80) {
    ctx.beginPath();
    ctx.moveTo(tx, GROUND_Y);
    ctx.lineTo(tx, H);
    ctx.stroke();
  }

  // Background buildings
  ctx.fillStyle = 'rgba(20,20,60,0.7)';
  const buildings = [[50,200,60,170],[150,180,80,190],[280,210,50,160],[380,190,70,180],[500,200,60,170],[620,185,80,185],[720,205,55,165]];
  for (const [bx, by, bw, bh] of buildings) {
    ctx.fillRect(bx, by, bw, bh);
    // Windows
    ctx.fillStyle = 'rgba(255,220,100,0.4)';
    for (let wy = by + 10; wy < by + bh - 10; wy += 20) {
      for (let wx = bx + 8; wx < bx + bw - 8; wx += 16) {
        if (Math.random() > 0.3) ctx.fillRect(wx, wy, 8, 10);
      }
    }
    ctx.fillStyle = 'rgba(20,20,60,0.7)';
  }
}

function drawHUD(p1, p2, timer) {
  const barW = 280;
  const barH = 22;
  const margin = 20;
  const topY = 12;

  // P1 health bar (left)
  const p1Pct = p1.hp / p1.maxHp;
  ctx.fillStyle = '#222';
  ctx.fillRect(margin, topY, barW, barH);
  const p1Color = p1Pct > 0.5 ? '#22dd44' : p1Pct > 0.25 ? '#ddcc22' : '#dd2222';
  ctx.fillStyle = p1Color;
  ctx.fillRect(margin, topY, Math.round(barW * p1Pct), barH);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(margin, topY, barW, barH);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px Arial';
  ctx.textAlign = 'left';
  ctx.fillText(p1.name, margin + 4, topY + 15);
  // HP number
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = '11px Arial';
  ctx.fillText(`${p1.hp}/${p1.maxHp}`, margin + barW - 65, topY + 14);

  // P2 health bar (right)
  const p2Pct = p2.hp / p2.maxHp;
  ctx.fillStyle = '#222';
  ctx.fillRect(W - margin - barW, topY, barW, barH);
  const p2Color = p2Pct > 0.5 ? '#22dd44' : p2Pct > 0.25 ? '#ddcc22' : '#dd2222';
  ctx.fillStyle = p2Color;
  ctx.fillRect(W - margin - barW + Math.round(barW * (1 - p2Pct)), topY, Math.round(barW * p2Pct), barH);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(W - margin - barW, topY, barW, barH);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px Arial';
  ctx.textAlign = 'right';
  ctx.fillText(p2.name, W - margin - 4, topY + 15);
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = '11px Arial';
  ctx.fillText(`${p2.hp}/${p2.maxHp}`, W - margin - barW + 65, topY + 14);

  // Timer
  const timerSec = Math.ceil(timer / 1000);
  ctx.fillStyle = timerSec <= 10 ? '#ff4444' : '#ffffff';
  ctx.font = 'bold 28px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(timerSec, W / 2, topY + 22);

  // Scores
  ctx.fillStyle = '#ffdd00';
  ctx.font = 'bold 16px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(`${scores.p1} - ${scores.p2}`, W / 2, topY + 44);

  // Cooldown bars
  drawCooldownBars(p1, margin, topY + barH + 6, 1);
  drawCooldownBars(p2, W - margin - barW, topY + barH + 6, -1);

  // Combo counter
  const p1Combo = fighters[0] ? fighters[0].comboCount : 0;
  if (p1Combo >= 2) {
    ctx.font = 'bold 22px Arial';
    ctx.fillStyle = '#ff9900';
    ctx.textAlign = 'left';
    ctx.fillText(`${p1Combo}连击!`, margin, topY + barH + 50);
  }
}

function drawCooldownBars(fighter, x, y, dir) {
  const keys2 = ['normal','skill1','skill2','ultimate'];
  const labels = ['J','K','L','U'];
  const maxCDs = { normal: 600, skill1: 4000, skill2: 5000, ultimate: 9000 };
  const barW = 280;
  const segW = barW / 4;
  for (let i = 0; i < 4; i++) {
    const cd = fighter.cooldowns[keys2[i]];
    const maxCD = fighter.moves[keys2[i]] ? fighter.moves[keys2[i]].cooldown || maxCDs[keys2[i]] : maxCDs[keys2[i]];
    const pct = 1 - cd / maxCD;
    const sx = dir === 1 ? x + i * segW : x + (3 - i) * segW;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(sx + 1, y, segW - 2, 6);
    const colors = ['#44ff44','#4488ff','#ffcc00','#ff4444'];
    ctx.fillStyle = pct >= 1 ? colors[i] : `rgba(${colors[i]})`;
    ctx.fillStyle = cd <= 0 ? colors[i] : 'rgba(100,100,100,0.6)';
    ctx.fillRect(sx + 1, y, Math.round((segW - 2) * pct), 6);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '8px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(labels[i], sx + segW / 2, y + 13);
  }
}

function drawMenu() {
  // Background
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0d0d2b');
  grad.addColorStop(1, '#1a1a4e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Title
  ctx.save();
  ctx.shadowColor = '#ffdd00';
  ctx.shadowBlur = 30;
  ctx.font = 'bold 56px Arial';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd700';
  ctx.fillText('👨‍👩‍👧‍👦 家庭格斗大战', W / 2, 100);
  ctx.restore();

  ctx.font = '20px Arial';
  ctx.fillStyle = '#aaa';
  ctx.textAlign = 'center';
  ctx.fillText('Family Battle', W / 2, 135);

  // Animated characters preview
  const t = Date.now() * 0.001;
  const chars = ['👩‍🍳','👨‍🦱','👩‍🎤','👨‍🎓','👧'];
  for (let i = 0; i < chars.length; i++) {
    const px2 = 120 + i * 130;
    const py2 = 210 + Math.sin(t + i) * 10;
    ctx.font = '50px serif';
    ctx.textAlign = 'center';
    ctx.fillText(chars[i], px2, py2);
  }

  // Menu options
  const options = [
    { label: '🎮 单人模式', color: '#44ff88' },
    { label: '👥 双人模式', color: '#4488ff' },
    { label: '🏆 通关模式', color: '#ffcc00' },
    { label: '📊 排行榜', color: '#ff88cc' }
  ];
  const menuY = 270;
  const menuX = W / 2;
  for (let i = 0; i < options.length; i++) {
    const oy = menuY + i * 40;
    const selected = menuSelection === i;
    if (selected) {
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(menuX - 160, oy - 22, 320, 32);
      ctx.strokeStyle = options[i].color;
      ctx.lineWidth = 2;
      ctx.strokeRect(menuX - 160, oy - 22, 320, 32);
    }
    ctx.font = selected ? 'bold 22px Arial' : '20px Arial';
    ctx.fillStyle = selected ? options[i].color : '#ccc';
    ctx.textAlign = 'center';
    ctx.fillText(options[i].label, menuX, oy);
  }

  ctx.fillStyle = '#666';
  ctx.font = '14px Arial';
  ctx.fillText('↑↓ 选择  Enter 确认', W / 2, H - 20);
}

let menuSelection = 0;

function drawCharSelect() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0d0d2b');
  grad.addColorStop(1, '#1a1a4e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  const title = gameMode === 'pvp' ?
    `选择角色 - 玩家${selectingPlayer + 1}` :
    (gameMode === 'story' ? '通关模式 - 何熙出发！' : '选择你的角色');
  ctx.font = 'bold 28px Arial';
  ctx.fillStyle = '#ffd700';
  ctx.textAlign = 'center';
  ctx.fillText(title, W / 2, 40);

  for (let i = 0; i < CHAR_ORDER.length; i++) {
    const charId = CHAR_ORDER[i];
    const def = CHAR_DEFS[charId];
    const cx2 = 80 + i * 145;
    const cy2 = 160;
    const selected = charSelectIndex === i;

    // Card
    ctx.fillStyle = selected ? `${def.color}33` : 'rgba(255,255,255,0.05)';
    ctx.strokeStyle = selected ? def.color : '#444';
    ctx.lineWidth = selected ? 3 : 1;
    roundRect(cx2 - 60, cy2 - 80, 120, 160, 10);
    ctx.fill();
    ctx.stroke();

    // Emoji
    ctx.font = '56px serif';
    ctx.textAlign = 'center';
    ctx.fillText(def.emoji, cx2, cy2 - 10);

    // Name
    ctx.font = 'bold 14px Arial';
    ctx.fillStyle = selected ? def.color : '#ccc';
    ctx.fillText(def.name, cx2, cy2 + 40);

    // HP
    ctx.font = '12px Arial';
    ctx.fillStyle = '#888';
    ctx.fillText(`HP: ${def.hp}`, cx2, cy2 + 58);

    // Already selected indicator
    if (gameMode === 'pvp') {
      if (selectedChars[0] === charId) {
        ctx.fillStyle = 'rgba(100,200,255,0.3)';
        ctx.font = '12px Arial';
        ctx.fillText('P1', cx2, cy2 - 65);
      }
      if (selectedChars[1] === charId) {
        ctx.fillStyle = 'rgba(255,150,100,0.3)';
        ctx.font = '12px Arial';
        ctx.fillText('P2', cx2, cy2 - 65);
      }
    }
  }

  // Selected character info
  if (charSelectIndex >= 0 && charSelectIndex < CHAR_ORDER.length) {
    const def = CHAR_DEFS[CHAR_ORDER[charSelectIndex]];
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(def.name, W / 2, 285);
    const moveNames = [
      `J: ${def.moves.normal.name}`,
      `K: ${def.moves.skill1.name}`,
      `L: ${def.moves.skill2.name}`,
      `U: ${def.moves.ultimate.name}`
    ];
    ctx.font = '13px Arial';
    ctx.fillStyle = '#aaa';
    for (let mi = 0; mi < moveNames.length; mi++) {
      ctx.fillText(moveNames[mi], 200 + mi * 100, 310);
    }
  }

  ctx.fillStyle = '#666';
  ctx.font = '14px Arial';
  ctx.fillText('← → 选择角色  Enter 确认', W / 2, H - 20);
}

let charSelectIndex = 0;

function drawDiffSelect() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0d0d2b');
  grad.addColorStop(1, '#1a1a4e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.font = 'bold 32px Arial';
  ctx.fillStyle = '#ffd700';
  ctx.textAlign = 'center';
  ctx.fillText('选择难度', W / 2, 100);

  const diffs = [
    { key: 'easy', label: '😊 简单', desc: 'AI反应慢，适合新手', color: '#44ff88' },
    { key: 'normal', label: '😐 普通', desc: 'AI有一定攻击性', color: '#ffcc00' },
    { key: 'hard', label: '😤 困难', desc: 'AI极具攻击性，挑战自我', color: '#ff4444' }
  ];

  for (let i = 0; i < diffs.length; i++) {
    const d = diffs[i];
    const selected = diffSelectIndex === i;
    const dy = 180 + i * 80;
    ctx.fillStyle = selected ? `${d.color}22` : 'rgba(255,255,255,0.05)';
    ctx.strokeStyle = selected ? d.color : '#444';
    ctx.lineWidth = selected ? 3 : 1;
    roundRect(W / 2 - 200, dy - 30, 400, 60, 8);
    ctx.fill();
    ctx.stroke();
    ctx.font = selected ? 'bold 22px Arial' : '20px Arial';
    ctx.fillStyle = selected ? d.color : '#ccc';
    ctx.textAlign = 'center';
    ctx.fillText(d.label, W / 2, dy - 2);
    ctx.font = '13px Arial';
    ctx.fillStyle = '#888';
    ctx.fillText(d.desc, W / 2, dy + 20);
  }

  ctx.fillStyle = '#666';
  ctx.font = '14px Arial';
  ctx.fillText('↑↓ 选择  Enter 确认  Esc 返回', W / 2, H - 20);
}

let diffSelectIndex = 1;

function drawResult() {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, H);

  const winner = winnerSide === 'p1' ? fighters[0] : fighters[1];
  const loser = winnerSide === 'p1' ? fighters[1] : fighters[0];

  ctx.save();
  ctx.shadowColor = '#ffd700';
  ctx.shadowBlur = 40;
  ctx.font = 'bold 48px Arial';
  ctx.fillStyle = '#ffd700';
  ctx.textAlign = 'center';
  ctx.fillText('🏆 胜利！', W / 2, 120);
  ctx.restore();

  ctx.font = '60px serif';
  ctx.textAlign = 'center';
  ctx.fillText(winner.emoji, W / 2, 220);

  ctx.font = 'bold 28px Arial';
  ctx.fillStyle = '#fff';
  ctx.fillText(`${winner.name} 获胜！`, W / 2, 270);

  ctx.font = '20px Arial';
  ctx.fillStyle = '#aaa';
  ctx.fillText(`${loser.name} 倒下了`, W / 2, 310);

  if (gameMode === 'story' && winnerSide === 'p1') {
    if (storyBossIndex < STORY_ORDER.length - 1) {
      ctx.fillStyle = '#44ff88';
      ctx.fillText(`继续挑战下一关！`, W / 2, 350);
    } else {
      ctx.fillStyle = '#ffd700';
      ctx.fillText(`🎉 通关！你打败了所有人！`, W / 2, 350);
    }
  }

  ctx.fillStyle = '#666';
  ctx.font = '16px Arial';
  ctx.fillText('Enter 继续  Esc 返回主菜单', W / 2, H - 30);
}

function drawLeaderboard() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0d0d2b');
  grad.addColorStop(1, '#1a1a4e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.font = 'bold 32px Arial';
  ctx.fillStyle = '#ffd700';
  ctx.textAlign = 'center';
  ctx.fillText('🏆 排行榜', W / 2, 50);

  if (!recordData || !recordData.records || recordData.records.length === 0) {
    ctx.fillStyle = '#888';
    ctx.font = '20px Arial';
    ctx.fillText('暂无记录', W / 2, 200);
  } else {
    const sorted = [...recordData.records].sort((a, b) => b.wins - a.wins).slice(0, 8);
    for (let i = 0; i < sorted.length; i++) {
      const r = sorted[i];
      const ry = 90 + i * 42;
      ctx.fillStyle = i === 0 ? '#ffd700' : i === 1 ? '#c0c0c0' : i === 2 ? '#cd7f32' : '#888';
      ctx.font = 'bold 18px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(`${i + 1}. ${r.name} - ${r.wins}胜 ${r.losses}败`, W / 2, ry);
    }
  }

  ctx.fillStyle = '#666';
  ctx.font = '14px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('Esc 返回', W / 2, H - 20);
}

// ============================================================
// UTILITY
// ============================================================
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ============================================================
// FIGHT SETUP
// ============================================================
function startFight(p1CharId, p2CharId) {
  fighters = [];
  projectiles = [];
  effects = [];
  roundTimerMs = 60000;
  winnerSide = null;
  screenShake = { x: 0, y: 0, dur: 0 };

  const p1 = new Fighter(p1CharId, 'p1', 100);
  p1.y = GROUND_Y - p1.h;
  fighters.push(p1);

  const p2 = new Fighter(p2CharId, 'p2', W - 160);
  p2.y = GROUND_Y - p2.h;
  if (gameMode !== 'pvp') {
    p2.isAI = true;
  }
  fighters.push(p2);

  gameState = 'fight';
}

// ============================================================
// FIGHT LOGIC
// ============================================================
let lastTime = 0;
let fightCountdown = 3000; // 3 second countdown
let fightStarted = false;

function updateFight(dt) {
  if (!fightStarted) {
    fightCountdown -= dt;
    if (fightCountdown <= 0) { fightStarted = true; fightCountdown = 0; }
    return;
  }

  // Timer
  roundTimerMs -= dt;
  if (roundTimerMs <= 0) {
    roundTimerMs = 0;
    // Time up - decide winner by HP
    if (!winnerSide) {
      winnerSide = fighters[0].hp >= fighters[1].hp ? 'p1' : 'p2';
      endRound();
    }
    return;
  }

  const p1 = fighters[0];
  const p2 = fighters[1];

  // Check death
  if (!winnerSide) {
    if (p1.dead) { winnerSide = 'p2'; endRound(); return; }
    if (p2.dead) { winnerSide = 'p1'; endRound(); return; }
  }

  // P1 controls
  if (!p1.dead) {
    let moving = false;
    if (keys['p1_left']) { p1.tryMove(-1); moving = true; }
    if (keys['p1_right']) { p1.tryMove(1); moving = true; }
    if (!moving) p1.stopMove();

    if (keyPressed('p1_jump')) p1.tryJump();
    if (keyPressed('p1_normal')) p1.tryAttack('normal', p2, projectiles, effects);
    if (keyPressed('p1_skill1')) p1.tryAttack('skill1', p2, projectiles, effects);
    if (keyPressed('p1_skill2')) p1.tryAttack('skill2', p2, projectiles, effects);
    if (keyPressed('p1_ult')) p1.tryAttack('ultimate', p2, projectiles, effects);
  }

  // P2 controls (if PVP)
  if (!p2.dead && gameMode === 'pvp') {
    let moving = false;
    if (keys['p2_left']) { p2.tryMove(-1); moving = true; }
    if (keys['p2_right']) { p2.tryMove(1); moving = true; }
    if (!moving) p2.stopMove();

    if (keyPressed('p2_jump')) p2.tryJump();
    if (keyPressed('p2_normal')) p2.tryAttack('normal', p1, projectiles, effects);
    if (keyPressed('p2_skill1')) p2.tryAttack('skill1', p1, projectiles, effects);
    if (keyPressed('p2_skill2')) p2.tryAttack('skill2', p1, projectiles, effects);
    if (keyPressed('p2_ult')) p2.tryAttack('ultimate', p1, projectiles, effects);
  }

  // Update fighters
  p1.update(dt, p2);
  p2.update(dt, p1);

  // AI update
  if (p2.isAI) p2.updateAI(dt, p1, projectiles, effects);

  // Projectiles
  for (const proj of projectiles) {
    proj.update(dt, fighters, effects);
  }
  projectiles = projectiles.filter(p => p.alive);

  // Effects
  for (const eff of effects) {
    eff.update(dt);
  }
  effects = effects.filter(e => e.alive);

  // Screen shake decay
  if (screenShake.dur > 0) {
    screenShake.dur -= dt;
    if (screenShake.dur <= 0) { screenShake.x = 0; screenShake.y = 0; }
  }
}

function endRound() {
  if (winnerSide === 'p1') scores.p1++;
  else scores.p2++;

  // Celebrate
  const winner = winnerSide === 'p1' ? fighters[0] : fighters[1];
  winner.celebrateTimer = 5000;
  winner.state = 'idle';

  // Record to jsonbin
  saveRecord(winner.name);

  setTimeout(() => { gameState = 'result'; }, 1500);
}

function drawFight() {
  // Screen shake offset
  let sx = 0, sy = 0;
  if (screenShake.dur > 0) {
    sx = (Math.random() - 0.5) * screenShake.x;
    sy = (Math.random() - 0.5) * screenShake.y;
  }

  ctx.save();
  ctx.translate(sx, sy);

  drawBackground();

  // Draw fighters
  for (const f of fighters) f.draw(ctx);

  // Draw projectiles
  for (const p of projectiles) p.draw(ctx);

  // Draw effects
  for (const e of effects) e.draw(ctx);

  // Draw hit numbers
  for (const e of effects) {
    if (e instanceof HitNumber) e.draw(ctx);
  }

  ctx.restore();

  // HUD (no shake)
  drawHUD(fighters[0], fighters[1], roundTimerMs);

  // Countdown
  if (!fightStarted && fightCountdown > 0) {
    const sec = Math.ceil(fightCountdown / 1000);
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.font = 'bold 120px Arial';
    ctx.fillStyle = '#ffd700';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 40;
    ctx.fillText(sec === 0 ? 'GO!' : sec, W / 2, H / 2 + 40);
    ctx.restore();
  }

  // Slow motion indicators
  if (fighters[0] && fighters[0].slowTimer > 0) {
    ctx.fillStyle = 'rgba(100,200,255,0.2)';
    ctx.fillRect(fighters[0].x, fighters[0].y, fighters[0].w, fighters[0].h);
  }
  if (fighters[1] && fighters[1].slowTimer > 0) {
    ctx.fillStyle = 'rgba(100,200,255,0.2)';
    ctx.fillRect(fighters[1].x, fighters[1].y, fighters[1].w, fighters[1].h);
  }
}

// ============================================================
// JSONBIN INTEGRATION
// ============================================================
async function loadRecord() {
  try {
    const res = await fetch(JSONBIN_LATEST, {
      headers: { 'X-Master-Key': JSONBIN_KEY }
    });
    if (res.ok) {
      const data = await res.json();
      recordData = data.record || { records: [] };
    }
  } catch (e) {
    recordData = { records: [] };
  }
}

async function saveRecord(winnerName) {
  if (!recordData) recordData = { records: [] };
  let rec = recordData.records.find(r => r.name === winnerName);
  if (!rec) {
    rec = { name: winnerName, wins: 0, losses: 0 };
    recordData.records.push(rec);
  }
  rec.wins++;

  // Also record loss for loser
  const loser = winnerSide === 'p1' ? fighters[1] : fighters[0];
  let lRec = recordData.records.find(r => r.name === loser.name);
  if (!lRec) {
    lRec = { name: loser.name, wins: 0, losses: 0 };
    recordData.records.push(lRec);
  }
  lRec.losses++;

  try {
    await fetch(JSONBIN_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_KEY },
      body: JSON.stringify(recordData)
    });
  } catch (e) { /* ignore */ }
}

// ============================================================
// MAIN GAME LOOP
// ============================================================
let showLeaderboard = false;

function handleMenuInput() {
  if (keyPressed('p1_normal') || keyPressed('enter') || keys['enter'] && !prevKeys['enter']) {
    if (menuSelection === 0) { gameMode = 'single'; gameState = 'charselect'; charSelectIndex = 0; selectingPlayer = 0; selectedChars = [null, null]; }
    else if (menuSelection === 1) { gameMode = 'pvp'; gameState = 'charselect'; charSelectIndex = 0; selectingPlayer = 0; selectedChars = [null, null]; }
    else if (menuSelection === 2) {
      gameMode = 'story'; storyBossIndex = 0; selectedChars[0] = 'hexi';
      startFight('hexi', STORY_ORDER[0]);
      fightStarted = false; fightCountdown = 3000;
    }
    else if (menuSelection === 3) { showLeaderboard = true; }
  }
  if (keyPressed('p1_jump') || (keys['ArrowUp'] && !prevKeys['ArrowUp'])) menuSelection = Math.max(0, menuSelection - 1);
  if (keys['p2_left'] && !prevKeys['p2_left'] || keys['ArrowDown'] && !prevKeys['ArrowDown']) menuSelection = Math.min(3, menuSelection + 1);
  // Arrow down for menu
  if (keys['ArrowDown'] && !prevKeys['ArrowDown']) menuSelection = Math.min(3, menuSelection + 1);
  if (keys['ArrowUp'] && !prevKeys['ArrowUp']) menuSelection = Math.max(0, menuSelection - 1);
}

function handleCharSelectInput() {
  if (keys['ArrowLeft'] && !prevKeys['ArrowLeft'] || keys['p1_left'] && !prevKeys['p1_left']) {
    charSelectIndex = Math.max(0, charSelectIndex - 1);
  }
  if (keys['ArrowRight'] && !prevKeys['ArrowRight'] || keys['p1_right'] && !prevKeys['p1_right']) {
    charSelectIndex = Math.min(CHAR_ORDER.length - 1, charSelectIndex + 1);
  }

  if (keys['enter'] && !prevKeys['enter'] || keys['p1_normal'] && !prevKeys['p1_normal']) {
    const charId = CHAR_ORDER[charSelectIndex];
    if (gameMode === 'single') {
      selectedChars[0] = charId;
      gameState = 'diffselect';
    } else if (gameMode === 'pvp') {
      selectedChars[selectingPlayer] = charId;
      selectingPlayer++;
      if (selectingPlayer >= 2) {
        startFight(selectedChars[0], selectedChars[1]);
        fightStarted = false; fightCountdown = 3000;
      }
    }
  }

  if (keys['esc'] && !prevKeys['esc']) gameState = 'menu';
}

function handleDiffSelectInput() {
  if (keys['ArrowUp'] && !prevKeys['ArrowUp']) diffSelectIndex = Math.max(0, diffSelectIndex - 1);
  if (keys['ArrowDown'] && !prevKeys['ArrowDown']) diffSelectIndex = Math.min(2, diffSelectIndex + 1);
  if (keys['enter'] && !prevKeys['enter'] || keys['p1_normal'] && !prevKeys['p1_normal']) {
    const diffs = ['easy', 'normal', 'hard'];
    difficulty = diffs[diffSelectIndex];
    // Choose random AI opponent for single mode
    let aiChar = CHAR_ORDER[Math.floor(Math.random() * CHAR_ORDER.length)];
    while (aiChar === selectedChars[0]) aiChar = CHAR_ORDER[Math.floor(Math.random() * CHAR_ORDER.length)];
    selectedChars[1] = aiChar;
    startFight(selectedChars[0], selectedChars[1]);
    fightStarted = false; fightCountdown = 3000;
  }
  if (keys['esc'] && !prevKeys['esc']) gameState = 'charselect';
}

function handleResultInput() {
  if (keys['enter'] && !prevKeys['enter'] || keys['p1_normal'] && !prevKeys['p1_normal']) {
    if (gameMode === 'story' && winnerSide === 'p1') {
      storyBossIndex++;
      if (storyBossIndex < STORY_ORDER.length) {
        startFight('hexi', STORY_ORDER[storyBossIndex]);
        fightStarted = false; fightCountdown = 3000;
      } else {
        gameState = 'menu';
      }
    } else if (gameMode === 'pvp') {
      startFight(selectedChars[0], selectedChars[1]);
      fightStarted = false; fightCountdown = 3000;
    } else {
      gameState = 'menu';
    }
  }
  if (keys['esc'] && !prevKeys['esc']) gameState = 'menu';
}

function gameLoop(timestamp) {
  const dt = Math.min(timestamp - lastTime, 50);
  lastTime = timestamp;

  // Save prev keys
  Object.assign(prevKeys, keys);

  if (showLeaderboard) {
    drawLeaderboard();
    if (keys['esc'] && !prevKeys['esc']) showLeaderboard = false;
    Object.assign(prevKeys, keys);
    requestAnimationFrame(gameLoop);
    return;
  }

  if (gameState === 'menu') {
    handleMenuInput();
    drawMenu();
  } else if (gameState === 'charselect') {
    handleCharSelectInput();
    drawCharSelect();
  } else if (gameState === 'diffselect') {
    handleDiffSelectInput();
    drawDiffSelect();
  } else if (gameState === 'fight') {
    updateFight(dt);
    drawFight();
    if (keys['esc'] && !prevKeys['esc']) gameState = 'menu';
  } else if (gameState === 'result') {
    drawFight();
    drawResult();
    handleResultInput();
  }

  // Copy prev keys
  Object.assign(prevKeys, keys);
  requestAnimationFrame(gameLoop);
}

// ============================================================
// BOOT
// ============================================================
loadRecord();
requestAnimationFrame(ts => { lastTime = ts; requestAnimationFrame(gameLoop); });
</script>
